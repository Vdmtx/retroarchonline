name: Validar Arcade Vault
on:
  push:
    branches: [main, reconstrucao-mobile]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/validate.mjs
