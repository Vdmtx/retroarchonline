<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔧 Admin - Arcade Library</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; color: #fff; font-family: Arial, sans-serif; padding: 20px; }
        h1 { color: #00ff88; text-align: center; margin-bottom: 30px; }
        .back-link { text-align: center; margin-bottom: 20px; }
        .back-link a { color: #00ff88; text-decoration: none; }
        .config-box { background: #1a1a2e; border: 2px solid #00ff88; padding: 20px; border-radius: 12px; margin-bottom: 30px; max-width: 600px; margin-left: auto; margin-right: auto; }
        .config-box label { display: block; margin-bottom: 10px; color: #00ff88; font-weight: bold; }
        .config-box input, .config-box select { width: 100%; padding: 10px; background: #0a0a0a; border: 2px solid #333; color: #fff; border-radius: 6px; margin-bottom: 15px; }
        .config-box button { width: 100%; padding: 12px; background: #00ff88; color: #000; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; }
        .config-box button:hover { background: #00cc6a; }
        .toolbar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        .toolbar button { padding: 10px 20px; background: #1a1a2e; color: #fff; border: 2px solid #333; border-radius: 6px; cursor: pointer; }
        .toolbar button:hover { border-color: #00ff88; }
        .toolbar button.active { background: #00ff88; color: #000; }
        .file-list { max-width: 1200px; margin: 0 auto; }
        .folder { background: #1a1a2e; border: 2px solid #333; border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
        .folder-header { padding: 15px; background: #16213e; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .folder-header:hover { background: #1e2d4a; }
        .folder-content { padding: 15px; display: none; }
        .folder-content.active { display: block; }
        .file-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #0a0a0a; border-radius: 6px; margin-bottom: 8px; border-left: 4px solid transparent; }
        .file-item:hover { background: #1a1a2e; }
        .file-item.verified { border-left-color: #00ff88; }
        .file-item.pending { border-left-color: #ff8800; }
        .file-item.failed { border-left-color: #ff0000; }
        .file-name { flex: 1; display: flex; align-items: center; gap: 8px; }
        .file-size { color: #888; margin-right: 15px; }
        .file-status { font-size: 16px; margin-right: 10px; }
        .file-actions { display: flex; gap: 8px; }
        .btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .btn-delete { background: #ff0000; color: #fff; }
        .btn-delete:hover { background: #cc0000; }
        .btn-move { background: #0088ff; color: #fff; }
        .btn-move:hover { background: #0066cc; }
        .btn-verify { background: #ff8800; color: #fff; }
        .btn-verify:hover { background: #cc6600; }
        .upload-area { border: 3px dashed #00ff88; border-radius: 12px; padding: 40px; text-align: center; margin-bottom: 30px; cursor: pointer; transition: 0.3s; }
        .upload-area:hover { background: rgba(0,255,136,0.1); }
        .upload-area.dragover { background: rgba(0,255,136,0.2); border-color: #00cc6a; }
        .status { position: fixed; bottom: 20px; right: 20px; background: #00ff88; color: #000; padding: 15px 25px; border-radius: 8px; display: none; z-index: 1000; font-weight: bold; max-width: 400px; }
        .status.error { background: #ff0000; color: #fff; }
        .status.warning { background: #ff8800; color: #000; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: #1a1a2e; padding: 30px; border-radius: 12px; border: 2px solid #00ff88; min-width: 500px; max-height: 80vh; overflow-y: auto; }
        .modal-content h3 { color: #00ff88; margin-bottom: 20px; }
        .modal-content input, .modal-content select { width: 100%; padding: 10px; background: #0a0a0a; border: 2px solid #333; color: #fff; border-radius: 6px; margin-bottom: 15px; }
        .modal-buttons { display: flex; gap: 10px; }
        .modal-buttons button { flex: 1; padding: 10px; border: none; border-radius: 6px; cursor: pointer; }
        .btn-confirm { background: #00ff88; color: #000; }
        .btn-cancel { background: #333; color: #fff; }
        .token-info { background: #ff880022; border: 2px solid #ff8800; padding: 15px; border-radius: 8px; margin-bottom: 20px; max-width: 600px; margin-left: auto; margin-right: auto; color: #ffaa00; font-size: 14px; }
        .help-text { color: #888; font-size: 12px; margin-top: 5px; }
        
        /* Log de Atividades */
        .activity-log { background: #1a1a2e; border: 2px solid #333; border-radius: 8px; padding: 20px; margin-bottom: 20px; max-width: 1200px; margin-left: auto; margin-right: auto; }
        .activity-log h3 { color: #00ff88; margin-bottom: 15px; }
        .log-entry { padding: 8px; background: #0a0a0a; border-radius: 4px; margin-bottom: 5px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
        .log-entry.success { border-left: 3px solid #00ff88; }
        .log-entry.error { border-left: 3px solid #ff0000; }
        .log-entry.warning { border-left: 3px solid #ff8800; }
        .log-time { color: #666; font-size: 11px; }
        
        /* Relatório de Verificação */
        .verification-report { background: #1a1a2e; border: 2px solid #0088ff; border-radius: 8px; padding: 20px; margin-bottom: 20px; max-width: 1200px; margin-left: auto; margin-right: auto; display: none; }
        .verification-report.active { display: block; }
        .verification-report h3 { color: #0088ff; margin-bottom: 15px; }
        .report-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-box { background: #0a0a0a; padding: 15px; border-radius: 6px; text-align: center; }
        .stat-number { font-size: 32px; font-weight: bold; color: #00ff88; }
        .stat-label { color: #888; font-size: 12px; margin-top: 5px; }
        .stat-box.error .stat-number { color: #ff0000; }
        .stat-box.warning .stat-number { color: #ff8800; }
        
        .progress-bar { width: 100%; height: 20px; background: #333; border-radius: 10px; overflow: hidden; margin: 10px 0; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #00ff88, #00cc6a); transition: width 0.3s; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: #000; }
    </style>
</head>
<body>
    <h1>🔧 Admin - Gerenciador de Arquivos</h1>
    <div class="back-link"><a href="index.html">← Voltar ao Menu</a></div>
    
    <div class="config-box" id="configBox">
        <label>⚠️ Gere um token em https://github.com/settings/tokens com permissão "repo"</label>
        <label>🔑 GitHub Personal Access Token:</label>
        <input type="password" id="token" placeholder="Cole seu token aqui...">
        <label>📦 Repositório:</label>
        <input type="text" id="repo" value="Vdmtx/retroarchonline">
        <label>🌿 Branch:</label>
        <input type="text" id="branch" value="main">
        <button onclick="salvarConfig()">✅ Conectar</button>
    </div>

    <div id="adminPanel" style="display:none;">
        <div class="token-info" id="tokenInfo"></div>
        
        <div class="toolbar">
            <button onclick="carregarArquivos()">🔄 Atualizar</button>
            <button onclick="document.getElementById('fileInput').click()">📤 Upload (até 70MB)</button>
            <button onclick="adicionarLinkExterno()">🔗 Link Externo</button>
            <button onclick="criarPasta()">📁 Nova Pasta</button>
            <button onclick="verificarTodos()" id="btnVerifyAll">✅ Verificar Todos</button>
            <button onclick="toggleLog()">📋 Log</button>
            <input type="file" id="fileInput" multiple style="display:none;" onchange="uploadArquivos(event)">
        </div>

        <div class="upload-area" id="uploadArea" ondrop="dropHandler(event)" ondragover="dragOverHandler(event)" ondragleave="dragLeaveHandler(event)">
            <h2> Arraste arquivos aqui para upload</h2>
            <p>✅ Limite: 70MB | Arquivos maiores: Google Drive, MediaFire, Archive.org</p>
        </div>

        <!-- Relatório de Verificação -->
        <div class="verification-report" id="verificationReport">
            <h3>📊 Relatório de Verificação</h3>
            <div class="report-stats" id="reportStats"></div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%">0%</div>
            </div>
            <div id="verificationDetails"></div>
        </div>

        <!-- Log de Atividades -->
        <div class="activity-log" id="activityLog" style="display:none;">
            <h3> Log de Atividades</h3>
            <div id="logEntries"></div>
            <button onclick="limparLog()" style="margin-top: 10px; padding: 8px 16px; background: #333; color: #fff; border: none; border-radius: 4px; cursor: pointer;">Limpar Log</button>
        </div>

        <div class="file-list" id="fileList"></div>
    </div>

    <div class="status" id="status"></div>

    <div class="modal" id="moveModal">
        <div class="modal-content">
            <h3>📁 Mover Arquivo</h3>
            <input type="text" id="movePath" placeholder="Novo caminho (ex: roms/neogeo/)">
            <div class="modal-buttons">
                <button class="btn-confirm" onclick="confirmarMovimento()">Mover</button>
                <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
            </div>
        </div>
    </div>

    <div class="modal" id="linkModal">
        <div class="modal-content">
            <h3>🔗 Adicionar Link Externo</h3>
            
            <label>Serviço de Hospedagem:</label>
            <select id="linkService" onchange="atualizarPlaceholderLink()">
                <option value="archive">📦 Archive.org (Recomendado)</option>
                <option value="gdrive">🔵 Google Drive</option>
                <option value="mediafire">🔴 MediaFire</option>
                <option value="custom">🔗 Outro/URL Direta</option>
            </select>
            
            <label>Nome do Arquivo (ex: kof99.zip):</label>
            <input type="text" id="linkName" placeholder="kof99.zip">
            
            <label>URL do Arquivo:</label>
            <input type="text" id="linkUrl" placeholder="https://archive.org/download/roms/kof99.zip">
            <div class="help-text" id="linkHelp">Cole o link direto do Archive.org</div>
            
            <label>Caminho no Repositório:</label>
            <input type="text" id="linkPath" placeholder="roms/neogeo/">
            
            <div class="modal-buttons">
                <button class="btn-confirm" onclick="confirmarLinkExterno()">Adicionar</button>
                <button class="btn-cancel" onclick="fecharLinkModal()">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        let config = { token: '', repo: '', branch: '' };
        let arquivosAtuais = [];
        let arquivoParaMover = null;
        let atividadeLog = [];
        let statusVerificacao = {};
        const MAX_FILE_SIZE = 70 * 1024 * 1024;

        function salvarConfig() {
            config.token = document.getElementById('token').value.trim();
            config.repo = document.getElementById('repo').value.trim();
            config.branch = document.getElementById('branch').value.trim();
            
            if (!config.token) {
                mostrarStatus('❌ Token é obrigatório!', true);
                return;
            }
            
            if (!config.token.startsWith('ghp_')) {
                mostrarStatus('❌ Token inválido! Deve começar com ghp_', true);
                return;
            }
            
            localStorage.setItem('githubConfig', JSON.stringify(config));
            document.getElementById('configBox').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            testarToken();
        }

        async function testarToken() {
            mostrarStatus('🔄 Testando token...');
            try {
                const response = await fetch(`https://api.github.com/repos/${config.repo}`, {
                    headers: { 'Authorization': `token ${config.token}` }
                });
                
                if (response.status === 401) {
                    mostrarStatus('❌ Token inválido ou expirado!', true);
                    document.getElementById('tokenInfo').textContent = '⚠️ Token inválido. Gere um novo em https://github.com/settings/tokens';
                    return;
                }
                
                if (response.status === 404) {
                    mostrarStatus('❌ Repositório não encontrado!', true);
                    return;
                }
                
                const data = await response.json();
                document.getElementById('tokenInfo').textContent = `✅ Conectado como: ${data.owner.login} | Repo: ${data.name}`;
                mostrarStatus('✅ Token válido!');
                carregarArquivos();
            } catch (e) {
                mostrarStatus('❌ Erro: ' + e.message, true);
            }
        }

        async function carregarArquivos() {
            mostrarStatus('🔄 Carregando arquivos...');
            try {
                const response = await fetch(`https://api.github.com/repos/${config.repo}/git/trees/${config.branch}?recursive=1`, {
                    headers: { 
                        'Authorization': `token ${config.token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                
                if (!response.ok) throw new Error('Erro na API');
                
                const data = await response.json();
                arquivosAtuais = data.tree.filter(item => item.type === 'blob');
                renderizarArquivos();
                mostrarStatus(`✅ ${arquivosAtuais.length} arquivos carregados`);
                adicionarLog('info', `Carregados ${arquivosAtuais.length} arquivos do repositório`);
            } catch (e) {
                mostrarStatus('❌ Erro: ' + e.message, true);
                adicionarLog('error', `Erro ao carregar: ${e.message}`);
            }
        }

        function renderizarArquivos() {
            const pastas = {};
            arquivosAtuais.forEach(arquivo => {
                const path = arquivo.path;
                const parts = path.split('/');
                const pasta = parts.slice(0, -1).join('/') || 'root';
                
                if (!pastas[pasta]) pastas[pasta] = [];
                pastas[pasta].push(arquivo);
            });

            const fileList = document.getElementById('fileList');
            fileList.innerHTML = Object.keys(pastas).sort().map(pasta => `
                <div class="folder">
                    <div class="folder-header" onclick="toggleFolder('${pasta}')">
                        <span>📁 ${pasta} (${pastas[pasta].length} arquivos)</span>
                        <span>▼</span>
                    </div>
                    <div class="folder-content" id="folder-${pasta.replace(/\//g, '-')}">
                        ${pastas[pasta].map(arquivo => {
                            const status = statusVerificacao[arquivo.path] || 'pending';
                            const statusIcon = status === 'verified' ? '✅' : status === 'failed' ? '❌' : '⏳';
                            const statusClass = status;
                            return `
                                <div class="file-item ${statusClass}">
                                    <span class="file-name">
                                        <span class="file-status">${statusIcon}</span>
                                        ${arquivo.path.split('/').pop()}
                                    </span>
                                    <span class="file-size">${(arquivo.size/1024/1024).toFixed(2)} MB</span>
                                    <div class="file-actions">
                                        <button class="btn btn-verify" onclick="verificarArquivo('${arquivo.path}', '${arquivo.sha}')">Verificar</button>
                                        <button class="btn btn-move" onclick="abrirModalMover('${arquivo.path}')">Mover</button>
                                        <button class="btn btn-delete" onclick="deletarArquivo('${arquivo.path}', '${arquivo.sha}')">Deletar</button>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `).join('');
        }

        function toggleFolder(pasta) {
            const folderId = 'folder-' + pasta.replace(/\//g, '-');
            document.getElementById(folderId).classList.toggle('active');
        }

        async function uploadArquivos(event) {
            const files = Array.from(event.target.files).filter(f => {
                if (f.size > MAX_FILE_SIZE) {
                    mostrarStatus(`❌ ${f.name} >70MB. Use link externo.`, true);
                    adicionarLog('error', `${f.name} excede 70MB`);
                    return false;
                }
                return true;
            });
            
            for (const file of files) await uploadArquivo(file);
        }

        async function uploadArquivo(file) {
            mostrarStatus(`📤 ${file.name}...`);
            adicionarLog('info', `Iniciando upload: ${file.name} (${(file.size/1024/1024).toFixed(2)}MB)`);
            
            try {
                const buffer = await file.arrayBuffer();
                const uint8 = new Uint8Array(buffer);
                let binary = '';
                for (let i = 0; i < uint8.byteLength; i++) binary += String.fromCharCode(uint8[i]);
                const content = btoa(binary);
                
                const response = await fetch(`https://api.github.com/repos/${config.repo}/contents/${file.name}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${config.token}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify({
                        message: `Upload: ${file.name}`,
                        content: content,
                        branch: config.branch
                    })
                });
                
                if (response.ok) {
                    mostrarStatus(`✅ ${file.name} enviado!`);
                    adicionarLog('success', `Upload concluído: ${file.name}`);
                    await verificarArquivo(file.name, null, true);
                    carregarArquivos();
                } else {
                    const err = await response.json();
                    throw new Error(err.message);
                }
            } catch (e) {
                mostrarStatus(`❌ ${file.name}: ${e.message}`, true);
                adicionarLog('error', `Falha no upload: ${file.name} - ${e.message}`);
            }
        }

        async function verificarArquivo(path, sha, isNew = false) {
            mostrarStatus(`🔍 Verificando ${path}...`);
            adicionarLog('info', `Verificando: ${path}`);
            
            try {
                const response = await fetch(`https://api.github.com/repos/${config.repo}/contents/${path}`, {
                    headers: { 
                        'Authorization': `token ${config.token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    statusVerificacao[path] = 'verified';
                    mostrarStatus(`✅ ${path} verificado!`, false);
                    adicionarLog('success', `Verificado: ${path} (${(data.size/1024/1024).toFixed(2)}MB)`);
                    
                    if (sha && data.sha !== sha) {
                        adicionarLog('warning', `SHA diferente para ${path} - pode ter sido modificado`);
                    }
                } else {
                    statusVerificacao[path] = 'failed';
                    mostrarStatus(`❌ ${path} não encontrado!`, true);
                    adicionarLog('error', `Falha na verificação: ${path}`);
                }
                
                renderizarArquivos();
            } catch (e) {
                statusVerificacao[path] = 'failed';
                mostrarStatus(`❌ Erro ao verificar: ${e.message}`, true);
                adicionarLog('error', `Erro na verificação: ${path} - ${e.message}`);
                renderizarArquivos();
            }
        }

        async function verificarTodos() {
            const btn = document.getElementById('btnVerifyAll');
            btn.disabled = true;
            btn.textContent = '⏳ Verificando...';
            
            const report = document.getElementById('verificationReport');
            report.classList.add('active');
            
            let verificados = 0;
            let falhas = 0;
            let pendentes = 0;
            const total = arquivosAtuais.length;
            
            document.getElementById('reportStats').innerHTML = `
                <div class="stat-box">
                    <div class="stat-number">${total}</div>
                    <div class="stat-label">Total</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="statVerified">0</div>
                    <div class="stat-label">Verificados</div>
                </div>
                <div class="stat-box warning">
                    <div class="stat-number" id="statPending">0</div>
                    <div class="stat-label">Pendentes</div>
                </div>
                <div class="stat-box error">
                    <div class="stat-number" id="statFailed">0</div>
                    <div class="stat-label">Falhas</div>
                </div>
            `;
            
            for (let i = 0; i < arquivosAtuais.length; i++) {
                const arquivo = arquivosAtuais[i];
                const progresso = ((i + 1) / total) * 100;
                document.getElementById('progressFill').style.width = `${progresso}%`;
                document.getElementById('progressFill').textContent = `${Math.round(progresso)}%`;
                
                try {
                    const response = await fetch(`https://api.github.com/repos/${config.repo}/contents/${arquivo.path}`, {
                        headers: { 
                            'Authorization': `token ${config.token}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    });
                    
                    if (response.ok) {
                        statusVerificacao[arquivo.path] = 'verified';
                        verificados++;
                    } else {
                        statusVerificacao[arquivo.path] = 'failed';
                        falhas++;
                    }
                } catch (e) {
                    statusVerificacao[arquivo.path] = 'failed';
                    falhas++;
                }
                
                document.getElementById('statVerified').textContent = verificados;
                document.getElementById('statPending').textContent = pendentes;
                document.getElementById('statFailed').textContent = falhas;
                
                renderizarArquivos();
                
                // Delay para não sobrecarregar a API
                if (i % 10 === 0) await new Promise(r => setTimeout(r, 100));
            }
            
            btn.disabled = false;
            btn.textContent = '✅ Verificar Todos';
            
            adicionarLog('success', `Verificação completa: ${verificados} OK, ${falhas} falhas`);
            mostrarStatus(`✅ Verificação completa! ${verificados}/${total} verificados`, falhas > 0);
        }

        function atualizarPlaceholderLink() {
            const service = document.getElementById('linkService').value;
            const helpText = document.getElementById('linkHelp');
            const urlInput = document.getElementById('linkUrl');
            
            const examples = {
                archive: 'https://archive.org/download/roms/kof99.zip',
                gdrive: 'https://drive.google.com/file/d/FILE_ID/view',
                mediafire: 'https://www.mediafire.com/file/FILE_ID/kof99.zip',
                custom: 'https://exemplo.com/arquivo.zip'
            };
            
            const helps = {
                archive: 'Cole o link direto do Archive.org',
                gdrive: 'Cole o link de compartilhamento do Google Drive',
                mediafire: 'Cole o link do MediaFire',
                custom: 'Cole a URL direta do arquivo'
            };
            
            urlInput.placeholder = examples[service];
            helpText.textContent = helps[service];
        }

        function converterParaLinkDireto(url, service) {
            if (service === 'gdrive') {
                const fileIdMatch = url.match(/\/d\/([^/]+)/);
                if (fileIdMatch) {
                    const fileId = fileIdMatch[1];
                    return `https://drive.google.com/uc?export=download&id=${fileId}`;
                }
            }
            return url;
        }

        function adicionarLinkExterno() {
            atualizarPlaceholderLink();
            document.getElementById('linkModal').classList.add('active');
        }

        function fecharLinkModal() {
            document.getElementById('linkModal').classList.remove('active');
        }

        async function confirmarLinkExterno() {
            const service = document.getElementById('linkService').value;
            const name = document.getElementById('linkName').value.trim();
            const url = document.getElementById('linkUrl').value.trim();
            const path = document.getElementById('linkPath').value.trim();
            
            if (!name || !url || !path) {
                mostrarStatus('❌ Preencha todos os campos!', true);
                return;
            }
            
            const directUrl = converterParaLinkDireto(url, service);
            const fullPath = path.endsWith('/') ? path + name : path + '/' + name;
            
            const linkData = {
                url: directUrl,
                originalUrl: url,
                type: 'external_link',
                service: service,
                added: new Date().toISOString()
            };
            
            const content = btoa(JSON.stringify(linkData, null, 2));
            
            try {
                const response = await fetch(`https://api.github.com/repos/${config.repo}/contents/${fullPath}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${config.token}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify({
                        message: `Add ${service} link: ${name}`,
                        content: content,
                        branch: config.branch
                    })
                });
                
                if (response.ok) {
                    mostrarStatus(`✅ Link ${service} adicionado: ${name}`);
                    adicionarLog('success', `Link externo adicionado: ${name} (${service})`);
                    fecharLinkModal();
                    await verificarArquivo(fullPath, null, true);
                    carregarArquivos();
                } else {
                    const err = await response.json();
                    throw new Error(err.message);
                }
            } catch (e) {
                mostrarStatus(`❌ Erro: ${e.message}`, true);
                adicionarLog('error', `Falha ao adicionar link: ${name} - ${e.message}`);
            }
        }

        async function deletarArquivo(path, sha) {
            if (!confirm(`Deletar ${path}?`)) return;
            
            mostrarStatus(`🗑️ Deletando ${path}...`);
            adicionarLog('info', `Deletando: ${path}`);
            
            try {
                const response = await fetch(`https://api.github.com/repos/${config.repo}/contents/${path}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `token ${config.token}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify({
                        message: `Delete ${path}`,
                        sha: sha,
                        branch: config.branch
                    })
                });
                
                if (response.ok) {
                    mostrarStatus(`✅ ${path} deletado!`);
                    adicionarLog('success', `Deletado: ${path}`);
                    delete statusVerificacao[path];
                    carregarArquivos();
                } else {
                    const error = await response.json();
                    mostrarStatus(`❌ Erro: ${error.message}`, true);
                    adicionarLog('error', `Falha ao deletar: ${path} - ${error.message}`);
                }
            } catch (e) {
                mostrarStatus(`❌ Erro: ${e.message}`, true);
                adicionarLog('error', `Erro ao deletar: ${path} - ${e.message}`);
            }
        }

        function abrirModalMover(path) {
            arquivoParaMover = path;
            document.getElementById('movePath').value = path.substring(0, path.lastIndexOf('/') + 1);
            document.getElementById('moveModal').classList.add('active');
        }

        async function confirmarMovimento() {
            const novoPath = document.getElementById('movePath').value.trim();
            if (!novoPath) {
                mostrarStatus('❌ Caminho vazio!', true);
                return;
            }
            
            const arquivo = arquivosAtuais.find(a => a.path === arquivoParaMover);
            if (!arquivo) {
                mostrarStatus('❌ Arquivo não encontrado!', true);
                return;
            }
            
            mostrarStatus(`📁 Movendo...`);
            adicionarLog('info', `Movendo: ${arquivoParaMover} para ${novoPath}`);
            
            try {
                const downloadResponse = await fetch(`https://api.github.com/repos/${config.repo}/contents/${arquivoParaMover}`, {
                    headers: { 
                        'Authorization': `token ${config.token}`,
                        'Accept': 'application/vnd.github.v3.raw'
                    }
                });
                
                if (!downloadResponse.ok) throw new Error('Erro ao baixar');
                
                const blob = await downloadResponse.blob();
                const arrayBuffer = await blob.arrayBuffer();
                const uint8Array = new Uint8Array(arrayBuffer);
                let binary = '';
                for (let i = 0; i < uint8Array.byteLength; i++) {
                    binary += String.fromCharCode(uint8Array[i]);
                }
                const content = btoa(binary);
                
                const fileName = arquivoParaMover.split('/').pop();
                const novoCaminho = novoPath.endsWith('/') ? novoPath + fileName : novoPath + '/' + fileName;
                
                const uploadResponse = await fetch(`https://api.github.com/repos/${config.repo}/contents/${novoCaminho}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${config.token}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify({
                        message: `Move ${arquivoParaMover}`,
                        content: content,
                        branch: config.branch
                    })
                });
                
                if (uploadResponse.ok) {
                    await deletarArquivo(arquivoParaMover, arquivo.sha);
                    mostrarStatus(`✅ Movido!`);
                    adicionarLog('success', `Movido: ${arquivoParaMover} → ${novoCaminho}`);
                    fecharModal();
                } else {
                    const error = await uploadResponse.json();
                    mostrarStatus(`❌ Erro: ${error.message}`, true);
                    adicionarLog('error', `Falha ao mover: ${arquivoParaMover} - ${error.message}`);
                }
            } catch (e) {
                mostrarStatus(`❌ Erro: ${e.message}`, true);
                adicionarLog('error', `Erro ao mover: ${arquivoParaMover} - ${e.message}`);
            }
        }

        function fecharModal() {
            document.getElementById('moveModal').classList.remove('active');
        }

        function criarPasta() {
            const nome = prompt('Nome da pasta (ex: roms/teste):');
            if (!nome) return;
            
            const path = `${nome}/.gitkeep`;
            const content = btoa('');
            
            fetch(`https://api.github.com/repos/${config.repo}/contents/${path}`, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${config.token}`,
                    'Content-Type': 'application/json',
                    'Accept': 'application/vnd.github.v3+json'
                },
                body: JSON.stringify({
                    message: `Create folder ${nome}`,
                    content: content,
                    branch: config.branch
                })
            }).then(response => {
                if (response.ok) {
                    mostrarStatus(`✅ Pasta ${nome} criada!`);
                    adicionarLog('success', `Pasta criada: ${nome}`);
                    carregarArquivos();
                } else {
                    response.json().then(e => {
                        mostrarStatus(`❌ Erro: ${e.message}`, true);
                        adicionarLog('error', `Falha ao criar pasta: ${nome}`);
                    });
                }
            });
        }

        function dragOverHandler(e) {
            e.preventDefault();
            document.getElementById('uploadArea').classList.add('dragover');
        }

        function dragLeaveHandler(e) {
            e.preventDefault();
            document.getElementById('uploadArea').classList.remove('dragover');
        }

        function dropHandler(e) {
            e.preventDefault();
            document.getElementById('uploadArea').classList.remove('dragover');
            
            const files = Array.from(e.dataTransfer.files).filter(f => {
                if (f.size > MAX_FILE_SIZE) {
                    mostrarStatus(`❌ ${f.name} >70MB!`, true);
                    adicionarLog('error', `${f.name} excede 70MB`);
                    return false;
                }
                return true;
            });
            
            files.forEach(f => uploadArquivo(f));
        }

        function adicionarLog(tipo, mensagem) {
            const agora = new Date();
            const timestamp = agora.toLocaleTimeString('pt-BR');
            atividadeLog.unshift({ tipo, mensagem, timestamp });
            
            if (atividadeLog.length > 100) atividadeLog.pop();
            
            renderizarLog();
        }

        function renderizarLog() {
            const logEntries = document.getElementById('logEntries');
            if (!logEntries) return;
            
            logEntries.innerHTML = atividadeLog.map(entry => `
                <div class="log-entry ${entry.tipo}">
                    <span>${entry.mensagem}</span>
                    <span class="log-time">${entry.timestamp}</span>
                </div>
            `).join('');
        }

        function toggleLog() {
            const log = document.getElementById('activityLog');
            log.style.display = log.style.display === 'none' ? 'block' : 'none';
        }

        function limparLog() {
            atividadeLog = [];
            renderizarLog();
        }

        function mostrarStatus(msg, erro = false) {
            const status = document.getElementById('status');
            status.textContent = msg;
            status.className = 'status' + (erro ? ' error' : '');
            status.style.display = 'block';
            setTimeout(() => { status.style.display = 'none'; }, 5000);
        }

        const savedConfig = localStorage.getItem('githubConfig');
        if (savedConfig) {
            config = JSON.parse(savedConfig);
            document.getElementById('token').value = config.token;
        }
    </script>
</body>
</html>
