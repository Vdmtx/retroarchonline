<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 Neo Geo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; color: #fff; font-family: Arial, sans-serif; padding: 20px; }
        h1 { color: #ff8800; text-align: center; margin-bottom: 20px; }
        .back-link { text-align: center; margin-bottom: 20px; }
        .back-link a { color: #00ff88; text-decoration: none; }
        .warning { background: #ff880022; border: 2px solid #ff8800; padding: 15px; border-radius: 8px; margin: 20px auto; max-width: 600px; text-align: center; color: #ffaa00; }
        .search-box { max-width: 600px; margin: 0 auto 30px; }
        .search-box input { width: 100%; padding: 12px; border: 2px solid #ff8800; border-radius: 25px; background: #1a1a2e; color: #fff; font-size: 16px; }
        .stats { text-align: center; color: #ff8800; margin-bottom: 20px; }
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; max-width: 1400px; margin: 0 auto; }
        .game-card { background: #1a1a2e; border: 2px solid #ff8800; border-radius: 12px; padding: 20px; cursor: pointer; text-align: center; transition: 0.3s; }
        .game-card:hover { border-color: #ffaa00; transform: translateY(-5px); box-shadow: 0 10px 30px rgba(255,136,0,0.3); }
        .game-icon { font-size: 56px; margin-bottom: 15px; }
        #game-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; }
        #game { width: 100%; height: 100%; }
        #back-btn { position: fixed; top: 15px; left: 15px; z-index: 1001; background: #000; color: #fff; border: 2px solid #ff8800; padding: 12px 24px; cursor: pointer; font-weight: bold; }
        #error-msg { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: #ff0000; color: #fff; padding: 15px 30px; border-radius: 8px; display: none; z-index: 3000; }
    </style>
</head>
<body>
    <h1>🔥 NEO GEO</h1>
    <div class="back-link"><a href="index.html">← Voltar ao Menu</a></div>
    <div class="warning">⚠️ <strong>Atenção:</strong> Requer BIOS NeoGeo completa (neogeo.zip)</div>
    <div class="search-box"><input type="text" id="search" placeholder="🔍 Buscar jogos..." oninput="filtrarJogos()"></div>
    <div class="stats" id="stats"></div>
    <div class="game-grid" id="gameGrid"></div>
    <div id="game-container">
        <button id="back-btn" onclick="voltar()">← Voltar</button>
        <div id="game"></div>
    </div>
    <div id="error-msg"></div>

    <script>
        const ROMS_BASE = 'https://vdmtx.github.io/retroarchonline/roms/';
        const BIOS_BASE = 'https://vdmtx.github.io/retroarchonline/bios/';
        let jogos = [];
        let neogeoBIOS = null;
        const NEOGEO_GAMES = ['kof', 'mslug', 'samsho', 'garou', 'rbff', 'fatfury', 'lastblad', 'metal', 'matrim', 'shocktr', 'blazstar', 'sengoku', 'aof', 'lbow', 'ninjacom', 'rotd', 'wjammers', 'karatour', 'magdrop', 'pulstar', 'zedblade'];

        async function carregarBIOS() {
            const biosFiles = ['neogeo.zip', 'neogeo(1).zip', 'neogeo(2).zip', 'neogeo(3).zip'];
            for (const biosFile of biosFiles) {
                try {
                    const url = BIOS_BASE + biosFile;
                    const response = await fetch(url, {method: 'HEAD'});
                    if (response.ok) {
                        neogeoBIOS = url;
                        console.log('✅ BIOS encontrada:', biosFile);
                        return true;
                    }
                } catch(e) {
                    console.log('❌ BIOS não encontrada:', biosFile);
                }
            }
            return false;
        }

        async function carregarJogos() {
            await carregarBIOS();
            const response = await fetch('https://api.github.com/repos/Vdmtx/retroarchonline/contents/roms');
            const files = await response.json();
            jogos = files.filter(f => {
                if (!f.name.endsWith('.zip')) return false;
                const nome = f.name.toLowerCase();
                return NEOGEO_GAMES.some(k => nome.includes(k));
            }).map(f => ({ nome: f.name.replace('.zip', ''), arquivo: f.name }))
              .sort((a, b) => a.nome.localeCompare(b.nome));
            
            document.getElementById('stats').textContent = `${jogos.length} jogo(s) • BIOS: ${neogeoBIOS ? '✅' : '❌'}`;
            document.getElementById('gameGrid').innerHTML = jogos.map(j => `
                <div class="game-card" onclick="iniciarJogo('${j.arquivo}')">
                    <div class="game-icon">🔥</div>
                    <div>${j.nome}</div>
                </div>
            `).join('');
        }

        function filtrarJogos() {
            const busca = document.getElementById('search').value.toLowerCase();
            const filtrados = jogos.filter(j => j.nome.toLowerCase().includes(busca));
            document.getElementById('gameGrid').innerHTML = filtrados.map(j => `
                <div class="game-card" onclick="iniciarJogo('${j.arquivo}')">
                    <div class="game-icon">🔥</div>
                    <div>${j.nome}</div>
                </div>
            `).join('');
        }

        function mostrarErro(msg) {
            const errDiv = document.getElementById('error-msg');
            errDiv.textContent = msg;
            errDiv.style.display = 'block';
            setTimeout(() => { errDiv.style.display = 'none'; }, 5000);
        }

        function iniciarJogo(arquivo) {
            document.getElementById('game-container').style.display = 'block';
            
            const romUrl = ROMS_BASE + encodeURIComponent(arquivo);
            
            // Verificar ROM
            fetch(romUrl, {method: 'HEAD'})
                .then(r => {
                    if (!r.ok) throw new Error('ROM não encontrada');
                    console.log('✅ ROM:', arquivo);
                    carregarEmulatorJS(arquivo);
                })
                .catch(e => {
                    console.error('❌ Erro:', e);
                    mostrarErro('❌ Erro: ' + e.message);
                    setTimeout(() => { document.getElementById('game-container').style.display = 'none'; }, 2000);
                });
        }

        function carregarEmulatorJS(arquivo) {
            const romUrl = ROMS_BASE + encodeURIComponent(arquivo);
            
            // Limpar configurações anteriores
            Object.keys(window).forEach(key => {
                if (key.startsWith('EJS_')) delete window[key];
            });
            document.getElementById('game').innerHTML = '';
            
            // Configurar
            window.EJS_player = "#game";
            window.EJS_core = "fbneo";
            window.EJS_gameUrl = romUrl;
            window.EJS_gameName = arquivo.replace('.zip', '');
            window.EJS_pathtodata = "https://cdn.emulatorjs.org/latest/data/";
            window.EJS_startOnLoaded = true;
            window.EJS_color = "#000000";
            
            // Adicionar BIOS se existir
            if (neogeoBIOS) {
                window.EJS_biosUrl = neogeoBIOS;
                console.log('💾 BIOS:', neogeoBIOS);
            } else {
                console.warn('⚠️ BIOS NeoGeo não encontrada!');
                mostrarErro('⚠️ BIOS NeoGeo ausente - alguns jogos podem não funcionar');
            }
            
            // Callbacks
            window.EJS_ready = function() {
                console.log('✅ Jogo carregado!');
            };
            
            window.EJS_onGameStart = function() {
                console.log('🎮 Jogo iniciado!');
            };
            
            // Carregar
            const script = document.createElement('script');
            script.src = "https://cdn.emulatorjs.org/latest/data/loader.js";
            
            script.onload = function() {
                console.log('✅ Loader carregado');
            };
            
            script.onerror = function() {
                console.error('❌ Erro ao carregar EmulatorJS');
                mostrarErro('❌ Erro ao carregar emulador');
            };
            
            document.body.appendChild(script);
        }

        function voltar() { location.reload(); }
        carregarJogos();
    </script>
</body>
</html>
