<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de ROMs - FBNeo</title>
    <script src="https://cdn.jsdelivr.net/npm/nostalgist@0.19.2/dist/nostalgist.umd.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }
        h1 {
            font-size: 2.5em;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .subtitle { color: #888; margin-bottom: 15px; }
        .info-box {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .info-box strong { color: #00d4ff; }
        .controls {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        .search-box {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 6px;
            color: #fff;
            font-size: 1em;
        }
        .roms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 15px;
        }
        .rom-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            transition: all 0.3s ease;
        }
        .rom-card:hover {
            border-color: #00d4ff;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.2);
        }
        .rom-system {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .system-neogeo { background: rgba(255, 107, 107, 0.3); color: #ff6b6b; }
        .system-cps { background: rgba(78, 205, 196, 0.3); color: #4ecdc4; }
        .system-midway { background: rgba(255, 230, 109, 0.3); color: #ffe66d; }
        .rom-name {
            font-size: 1.1em;
            font-weight: bold;
            color: #fff;
            margin-bottom: 8px;
            word-break: break-all;
        }
        .rom-size {
            font-size: 0.85em;
            color: #888;
            margin-bottom: 12px;
        }
        .test-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00d4ff, #7b2ff7);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .test-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.4);
        }
        #emulator-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.98);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #emulator-overlay.active { display: flex; }
        .close-btn {
            position: absolute;
            top: 20px; right: 20px;
            padding: 10px 20px;
            background: #ff4757;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            z-index: 10000;
        }
        .close-btn:hover { background: #ff6b7a; }
        .loading {
            color: #00d4ff;
            font-size: 1.5em;
            text-align: center;
        }
        .status-box {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 8px;
            color: #00d4ff;
            max-width: 700px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 0.85em;
            max-height: 400px;
            overflow-y: auto;
        }
        .status-box.error {
            background: rgba(255, 71, 87, 0.2);
            border-color: rgba(255, 71, 87, 0.5);
            color: #ff4757;
        }
        .progress-bar {
            width: 100%;
            max-width: 400px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-top: 15px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
            width: 0%;
            transition: width 0.3s ease;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(0, 212, 255, 0.5); border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 Teste de ROMs</h1>
            <p class="subtitle">FBNeo - Arcade (NeoGeo, CPS, Midway)</p>
            
            <div class="info-box">
                <strong>ℹ️ Informações:</strong><br>
                • Core: FBNeo (FinalBurn Neo)<br>
                • Compatível: NeoGeo, CPS1, CPS2, CPS3, Midway<br>
                • BIOS: Carregada automaticamente quando necessário
            </div>
        </header>

        <div class="controls">
            <input type="text" class="search-box" id="search-rom" placeholder="🔍 Buscar ROM..." onkeyup="filterRoms()">
        </div>

        <div id="roms-container"></div>
    </div>

    <div id="emulator-overlay">
        <button class="close-btn" onclick="closeEmulator()">✕ FECHAR</button>
        <div class="loading" id="loading-text">Carregando...</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="status-box" id="status-box"></div>
    </div>

    <script>
        const REPO_BASE = 'https://raw.githubusercontent.com/Vdmtx/retroarchonline/main';
        const GITHUB_API = 'https://api.github.com/repos/Vdmtx/retroarchonline/contents';
        let allRoms = [];

        window.addEventListener('DOMContentLoaded', async () => {
            await loadAllRoms();
        });

        async function loadAllRoms() {
            const systems = ['neogeo', 'cps', 'midway'];
            const container = document.getElementById('roms-container');
            container.innerHTML = '<div style="text-align: center; color: #00d4ff; padding: 40px;">⏳ Carregando ROMs...</div>';
            
            for (const system of systems) {
                try {
                    const response = await fetch(`${GITHUB_API}/roms/${system}`);
                    if (!response.ok) continue;
                    
                    const files = await response.json();
                    const roms = files.filter(f => f.type === 'file' && f.name.endsWith('.zip'));
                    
                    roms.forEach(rom => {
                        allRoms.push({
                            system: system,
                            name: rom.name,
                            size: rom.size
                        });
                    });
                } catch (e) {
                    console.error(`Erro ao carregar ${system}:`, e);
                }
            }
            
            displayRoms();
            updateStats();
        }

        function displayRoms(roms = allRoms) {
            const container = document.getElementById('roms-container');
            
            if (roms.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #888; padding: 40px;">Nenhuma ROM encontrada</div>';
                return;
            }
            
            container.innerHTML = `<div class="roms-grid">${roms.map(rom => `
                <div class="rom-card" data-name="${rom.name.toLowerCase()}">
                    <div class="rom-system system-${rom.system}">${rom.system.toUpperCase()}</div>
                    <div class="rom-name">${rom.name.replace('.zip', '')}</div>
                    <div class="rom-size">${formatFileSize(rom.size)}</div>
                    <button class="test-btn" onclick="testRom('${rom.system}', '${rom.name}')">▶ TESTAR</button>
                </div>
            `).join('')}</div>`;
        }

        function updateStats() {
            const total = allRoms.length;
            const neogeo = allRoms.filter(r => r.system === 'neogeo').length;
            const cps = allRoms.filter(r => r.system === 'cps').length;
            const midway = allRoms.filter(r => r.system === 'midway').length;
            
            const header = document.querySelector('header');
            const stats = document.createElement('div');
            stats.style.cssText = 'display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px;';
            stats.innerHTML = `
                <div style="background: rgba(0,212,255,0.1); padding: 10px; border-radius: 6px; text-align: center;">
                    <div style="font-size: 1.5em; color: #00d4ff; font-weight: bold;">${total}</div>
                    <div style="font-size: 0.8em; color: #888;">Total</div>
                </div>
                <div style="background: rgba(255,107,107,0.1); padding: 10px; border-radius: 6px; text-align: center;">
                    <div style="font-size: 1.5em; color: #ff6b6b; font-weight: bold;">${neogeo}</div>
                    <div style="font-size: 0.8em; color: #888;">NeoGeo</div>
                </div>
                <div style="background: rgba(78,205,196,0.1); padding: 10px; border-radius: 6px; text-align: center;">
                    <div style="font-size: 1.5em; color: #4ecdc4; font-weight: bold;">${cps}</div>
                    <div style="font-size: 0.8em; color: #888;">CPS</div>
                </div>
                <div style="background: rgba(255,230,109,0.1); padding: 10px; border-radius: 6px; text-align: center;">
                    <div style="font-size: 1.5em; color: #ffe66d; font-weight: bold;">${midway}</div>
                    <div style="font-size: 0.8em; color: #888;">Midway</div>
                </div>
            `;
            header.appendChild(stats);
        }

        async function testRom(system, romFile) {
            const overlay = document.getElementById('emulator-overlay');
            const loadingText = document.getElementById('loading-text');
            const statusBox = document.getElementById('status-box');
            const progressFill = document.getElementById('progress-fill');
            
            overlay.classList.add('active');
            loadingText.style.display = 'block';
            statusBox.style.display = 'block';
            statusBox.classList.remove('error');
            progressFill.style.width = '0%';
            
            let status = `🎮 Sistema: ${system.toUpperCase()}\n📦 ROM: ${romFile}\n🔧 Core: FBNeo\n\n⏳ Preparando...`;
            statusBox.textContent = status;
            setProgress(10);

            try {
                // Usar jsDelivr para evitar problemas de CORS
                const romUrl = `https://cdn.jsdelivr.net/gh/Vdmtx/retroarchonline@main/roms/${system}/${encodeURIComponent(romFile)}`;
                
                let biosUrl = null;
                if (system === 'neogeo') {
                    biosUrl = `https://cdn.jsdelivr.net/gh/Vdmtx/retroarchonline@main/bios/neogeo.zip`;
                    status += '\n🔌 BIOS: neogeo.zip';
                } else if (system === 'cps') {
                    biosUrl = `https://cdn.jsdelivr.net/gh/Vdmtx/retroarchonline@main/bios/qsound.zip`;
                    status += '\n🔌 BIOS: qsound.zip';
                }
                
                statusBox.textContent = status;
                setProgress(30);

                status += '\n\n🚀 Carregando emulador...';
                statusBox.textContent = status;
                setProgress(50);

                // Configuração simplificada - usa FBNeo automático
                const config = {
                    core: 'fbneo',
                    rom: romUrl
                };

                if (biosUrl) {
                    config.bios = biosUrl;
                }

                // Timeout de 60 segundos
                const loadPromise = Nostalgist.launch(config);
                const timeoutPromise = new Promise((_, reject) => {
                    setTimeout(() => reject(new Error('Timeout: Emulador demorou mais de 60 segundos')), 60000);
                });

                await Promise.race([loadPromise, timeoutPromise]);
                
                setProgress(100);
                status += '\n\n✅ EMULADOR INICIADO!\n\n' +
                    '🎮 Controles:\n' +
                    '• Setas/WASD: Mover\n' +
                    '• X/Z: Botão A\n' +
                    '• C/A: Botão B\n' +
                    '• Enter: Start\n' +
                    '• Shift: Select\n' +
                    '• 5: Insert Coin';
                
                statusBox.textContent = status;
                setTimeout(() => { loadingText.style.display = 'none'; }, 1000);

            } catch (error) {
                console.error('Erro:', error);
                setProgress(0);
                statusBox.classList.add('error');
                statusBox.textContent = `❌ ERRO\n\nSistema: ${system}\nROM: ${romFile}\n\nErro: ${error.message}\n\n💡 Soluções:\n1. Verifique se a ROM existe\n2. Confirme a BIOS (se necessário)\n3. Tente outro navegador\n4. Limpe o cache (Ctrl+F5)`;
            }
        }

        function setProgress(percent) {
            document.getElementById('progress-fill').style.width = percent + '%';
        }

        function filterRoms() {
            const search = document.getElementById('search-rom').value.toLowerCase();
            const filtered = allRoms.filter(rom => rom.name.toLowerCase().includes(search));
            displayRoms(filtered);
        }

        function closeEmulator() {
            document.getElementById('emulator-overlay').classList.remove('active');
            location.reload();
        }

        function formatFileSize(bytes) {
            if (!bytes) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
    </script>
</body>
</html>
