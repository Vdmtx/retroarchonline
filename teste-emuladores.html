<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de ROMs - Multi-Sistema</title>
    <script src="https://cdn.jsdelivr.net/npm/nostalgist@0.19.2/dist/nostalgist.umd.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }
        h1 {
            font-size: 2.5em;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .subtitle { color: #888; margin-bottom: 15px; }
        .info-box {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .info-box strong { color: #00d4ff; }
        .controls {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        .search-box {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 6px;
            color: #fff;
            font-size: 1em;
        }
        .roms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 15px;
        }
        .rom-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            transition: all 0.3s ease;
        }
        .rom-card:hover {
            border-color: #00d4ff;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.2);
        }
        .rom-system {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .system-neogeo { background: rgba(255, 107, 107, 0.3); color: #ff6b6b; }
        .system-cps { background: rgba(78, 205, 196, 0.3); color: #4ecdc4; }
        .system-midway { background: rgba(255, 230, 109, 0.3); color: #ffe66d; }
        .system-atomiswave { background: rgba(162, 89, 255, 0.3); color: #a259ff; }
        .rom-name {
            font-size: 1.1em;
            font-weight: bold;
            color: #fff;
            margin-bottom: 8px;
            word-break: break-all;
        }
        .rom-size {
            font-size: 0.85em;
            color: #888;
            margin-bottom: 12px;
        }
        .test-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00d4ff, #7b2ff7);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .test-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.4);
        }
        #emulator-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.98);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #emulator-overlay.active { display: flex; }
        .close-btn {
            position: absolute;
            top: 20px; right: 20px;
            padding: 10px 20px;
            background: #ff4757;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            z-index: 10000;
        }
        .close-btn:hover { background: #ff6b7a; }
        .loading {
            color: #00d4ff;
            font-size: 1.5em;
            text-align: center;
        }
        .status-box {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 8px;
            color: #00d4ff;
            max-width: 700px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 0.85em;
            max-height: 400px;
            overflow-y: auto;
        }
        .status-box.error {
            background: rgba(255, 71, 87, 0.2);
            border-color: rgba(255, 71, 87, 0.5);
            color: #ff4757;
        }
        .progress-bar {
            width: 100%;
            max-width: 400px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-top: 15px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
            width: 0%;
            transition: width 0.3s ease;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(0, 212, 255, 0.5); border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 Teste de ROMs</h1>
            <p class="subtitle">Multi-Sistema: CPS, Midway, Atomiswave, NeoGeo</p>
            
            <div class="info-box">
                <strong>ℹ️ Informações:</strong><br>
                • CPS/Midway/Atomiswave → Core: <strong>fbneo</strong> (CPS/Midway) e <strong>naomi</strong> (Atomiswave)<br>
                • NeoGeo → Core: <strong>fbneo</strong><br>
                • BIOS: Carregada automaticamente quando necessário
            </div>
        </header>

        <div class="controls">
            <input type="text" class="search-box" id="search-rom" placeholder="🔍 Buscar ROM..." onkeyup="filterRoms()">
        </div>

        <div id="roms-container"></div>
    </div>

    <div id="emulator-overlay">
        <button class="close-btn" onclick="closeEmulator()">✕ FECHAR</button>
        <div class="loading" id="loading-text">Carregando...</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="status-box" id="status-box"></div>
    </div>

    <script>
        /* ============================================================
           CONFIGURAÇÃO GLOBAL
           ============================================================ */
        const REPO_OWNER = 'Vdmtx';
        const REPO_NAME = 'retroarchonline';
        const REPO_BRANCH = 'main';
        const GITHUB_API = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents`;
        const CDN_BASE = `https://cdn.jsdelivr.net/gh/${REPO_OWNER}/${REPO_NAME}@${REPO_BRANCH}`;

        /* ============================================================
           MAPEAMENTO DE SISTEMAS
           ============================================================ */
        const SYSTEMS = {
            cps: {
                core: 'fbneo',
                bios: `${CDN_BASE}/bios/qsound.zip`,
                color: 'system-cps',
                label: 'CPS (1/2/3)'
            },
            midway: {
                core: 'fbneo',
                bios: null,
                color: 'system-midway',
                label: 'Midway'
            },
            atomiswave: {
                core: 'naomi',
                bios: `${CDN_BASE}/bios/awbios.zip`,
                color: 'system-atomiswave',
                label: 'Atomiswave'
            },
            neogeo: {
                core: 'fbneo',
                bios: `${CDN_BASE}/bios/neogeo.zip`,
                color: 'system-neogeo',
                label: 'NeoGeo'
            }
        };

        /* ============================================================
           DETECÇÃO AUTOMÁTICA DE SISTEMA POR PADRÕES DE NOMES
           ============================================================ */
        function detectSystemFromFilename(filename) {
            const name = filename.toLowerCase().replace('.zip', '');
            
            // CPS - Capcom Play System
            if (/^(sf|street\s*fighter|megaman|mvc|mars|capcom)/.test(name) || 
                /(^sf|sf2|sfiii|sfa|sfz|mvc|megaman)/.test(name)) {
                return 'cps';
            }
            
            // Midway - Mortal Kombat etc
            if (/^(mk|mortalkombat|umk|nba|nfl|wwf)/.test(name)) {
                return 'midway';
            }
            
            // NeoGeo - King of Fighters, Metal Slug, etc
            if (/^(kof|metal|slug|garou|rbff|samsh|fatfury|aof|artof|king|neo)/.test(name) ||
                /^(mslug|kof|garou|rbff|samsho|fatfur|aof)/.test(name)) {
                return 'neogeo';
            }
            
            // Atomiswave
            if (/^(atomis|aw)/.test(name)) {
                return 'atomiswave';
            }
            
            // Default: tenta detectar por palavras-chave
            if (/^(sf|street.*fighter|capcom)/.test(name)) return 'cps';
            if (/^(mk|mortal.*kombat)/.test(name)) return 'midway';
            if (/^(kof|king.*fighters|metal.*slug)/.test(name)) return 'neogeo';
            
            return 'neogeo'; // Default para NeoGeo (mais comum)
        }

        let allRoms = [];

        /* ============================================================
           INICIALIZAÇÃO
           ============================================================ */
        window.addEventListener('DOMContentLoaded', async () => {
            await loadAllRoms();
        });

        /* ============================================================
           loadAllRoms()
           Verifica se há subpastas organizadas, senão lê da raiz
           ============================================================ */
        async function loadAllRoms() {
            const container = document.getElementById('roms-container');
            container.innerHTML = '<div style="text-align: center; color: #00d4ff; padding: 40px;">⏳ Carregando ROMs...</div>';
            
            // Primeiro tenta carregar de subpastas organizadas
            for (const [systemKey, systemCfg] of Object.entries(SYSTEMS)) {
                try {
                    const response = await fetch(`${GITHUB_API}/roms/${systemKey}`);
                    if (response.ok) {
                        const files = await response.json();
                        const roms = files.filter(f => f.type === 'file' && f.name.endsWith('.zip'));
                        
                        roms.forEach(rom => {
                            allRoms.push({
                                system: systemKey,
                                name: rom.name,
                                size: rom.size,
                                path: `roms/${systemKey}/${rom.name}`
                            });
                        });
                        console.log(`✓ Carregadas ${roms.length} ROMs de /roms/${systemKey}/`);
                    }
                } catch (e) {
                    console.log(`✗ Pasta /roms/${systemKey}/ não encontrada`);
                }
            }
            
            // Se não encontrou ROMs em subpastas, tenta carregar da raiz
            if (allRoms.length === 0) {
                try {
                    console.log('Tentando carregar ROMs da raiz /roms/...');
                    const response = await fetch(`${GITHUB_API}/roms`);
                    if (response.ok) {
                        const files = await response.json();
                        const roms = files.filter(f => f.type === 'file' && f.name.endsWith('.zip'));
                        
                        roms.forEach(rom => {
                            const detectedSystem = detectSystemFromFilename(rom.name);
                            allRoms.push({
                                system: detectedSystem,
                                name: rom.name,
                                size: rom.size,
                                path: `roms/${rom.name}`
                            });
                        });
                        console.log(`✓ Carregadas ${roms.length} ROMs da raiz /roms/`);
                    }
                } catch (e) {
                    console.error('Erro ao carregar ROMs da raiz:', e);
                }
            }
            
            displayRoms();
            updateStats();
        }

        /* ============================================================
           displayRoms(roms)
           ============================================================ */
        function displayRoms(roms = allRoms) {
            const container = document.getElementById('roms-container');
            
            if (roms.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #888; padding: 40px;">Nenhuma ROM encontrada</div>';
                return;
            }
            
            container.innerHTML = `<div class="roms-grid">${roms.map(rom => {
                const cfg = SYSTEMS[rom.system];
                return `
                <div class="rom-card" data-name="${rom.name.toLowerCase()}">
                    <div class="rom-system ${cfg.color}">${cfg.label}</div>
                    <div class="rom-name">${rom.name.replace('.zip', '')}</div>
                    <div class="rom-size">${formatFileSize(rom.size)} • Core: ${cfg.core}</div>
                    <button class="test-btn" onclick="testRom('${rom.system}', '${rom.name}')">▶ TESTAR</button>
                </div>
            `}).join('')}</div>`;
        }

        /* ============================================================
           updateStats()
           ============================================================ */
        function updateStats() {
            const header = document.querySelector('header');
            const existingStats = header.querySelector('.stats-grid');
            if (existingStats) existingStats.remove();

            const stats = document.createElement('div');
            stats.className = 'stats-grid';
            stats.style.cssText = 'display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-top: 15px;';
            
            let html = `
                <div style="background: rgba(0,212,255,0.1); padding: 10px; border-radius: 6px; text-align: center;">
                    <div style="font-size: 1.5em; color: #00d4ff; font-weight: bold;">${allRoms.length}</div>
                    <div style="font-size: 0.8em; color: #888;">Total</div>
                </div>`;
            
            for (const [key, cfg] of Object.entries(SYSTEMS)) {
                const count = allRoms.filter(r => r.system === key).length;
                if (count > 0) {
                    const colorMap = {
                        'system-cps': '#4ecdc4',
                        'system-midway': '#ffe66d',
                        'system-atomiswave': '#a259ff',
                        'system-neogeo': '#ff6b6b'
                    };
                    html += `
                        <div style="background: rgba(255,255,255,0.05); padding: 10px; border-radius: 6px; text-align: center;">
                            <div style="font-size: 1.5em; color: ${colorMap[cfg.color]}; font-weight: bold;">${count}</div>
                            <div style="font-size: 0.8em; color: #888;">${cfg.label}</div>
                        </div>`;
                }
            }
            
            stats.innerHTML = html;
            header.appendChild(stats);
        }

        /* ============================================================
           testRom(system, romFile)
           ============================================================ */
        async function testRom(system, romFile) {
            const overlay = document.getElementById('emulator-overlay');
            const loadingText = document.getElementById('loading-text');
            const statusBox = document.getElementById('status-box');
            const progressFill = document.getElementById('progress-fill');
            const cfg = SYSTEMS[system];
            
            overlay.classList.add('active');
            loadingText.style.display = 'block';
            statusBox.style.display = 'block';
            statusBox.classList.remove('error');
            progressFill.style.width = '0%';
            
            let status = `🎮 Sistema: ${cfg.label}\n📦 ROM: ${romFile}\n🔧 Core: ${cfg.core}\n\n⏳ Verificando arquivos...`;
            statusBox.textContent = status;
            setProgress(10);

            try {
                // Verifica se a ROM existe
                const romUrl = `${CDN_BASE}/roms/${encodeURIComponent(romFile)}`;
                
                status += `\n🔗 URL: ${romUrl}`;
                statusBox.textContent = status;
                setProgress(20);
                
                // Testa se o arquivo está acessível
                try {
                    const testResponse = await fetch(romUrl, {method: 'HEAD'});
                    if (!testResponse.ok) {
                        throw new Error(`ROM não encontrada (HTTP ${testResponse.status})`);
                    }
                    status += '\n✓ ROM acessível';
                } catch (e) {
                    throw new Error(`ROM inacessível: ${e.message}`);
                }
                
                setProgress(30);
                
                if (cfg.bios) {
                    status += `\n🔌 BIOS: ${cfg.bios.split('/').pop()}`;
                    try {
                        const biosTest = await fetch(cfg.bios, {method: 'HEAD'});
                        if (biosTest.ok) {
                            status += ' ✓';
                        } else {
                            status += ' ✗ (opcional)';
                        }
                    } catch (e) {
                        status += ' ✗ (opcional)';
                    }
                } else {
                    status += '\n🔌 BIOS: não necessária';
                }
                
                statusBox.textContent = status;
                setProgress(40);

                status += '\n\n🚀 Carregando emulador...';
                statusBox.textContent = status;
                setProgress(60);

                const config = {
                    core: cfg.core,
                    rom: romUrl
                };

                if (cfg.bios) {
                    config.bios = cfg.bios;
                }

                // Configurações adicionais para melhor compatibilidade
                config.system = system;

                const loadPromise = Nostalgist.launch(config);
                const timeoutPromise = new Promise((_, reject) => {
                    setTimeout(() => reject(new Error('Timeout: Emulador demorou mais de 60 segundos')), 60000);
                });

                await Promise.race([loadPromise, timeoutPromise]);
                
                setProgress(100);
                status += '\n\n✅ EMULADOR INICIADO!\n\n' +
                    '🎮 Controles:\n' +
                    '• Setas/WASD: Mover\n' +
                    '• X/Z: Botão A\n' +
                    '• C/A: Botão B\n' +
                    '• Enter: Start\n' +
                    '• Shift: Select\n' +
                    '• 5: Insert Coin';
                
                statusBox.textContent = status;
                setTimeout(() => { loadingText.style.display = 'none'; }, 1000);

            } catch (error) {
                console.error('Erro:', error);
                setProgress(0);
                statusBox.classList.add('error');
                statusBox.textContent = `❌ ERRO\n\nSistema: ${cfg.label}\nROM: ${romFile}\nCore: ${cfg.core}\n\nErro: ${error.message}\n\n💡 Soluções:\n1. Verifique sua conexão\n2. Tente outro navegador\n3. Limpe o cache (Ctrl+F5)\n4. Verifique se o repositório está acessível`;
            }
        }

        /* ============================================================
           setProgress(percent)
           ============================================================ */
        function setProgress(percent) {
            document.getElementById('progress-fill').style.width = percent + '%';
        }

        /* ============================================================
           filterRoms()
           ============================================================ */
        function filterRoms() {
            const search = document.getElementById('search-rom').value.toLowerCase();
            const filtered = allRoms.filter(rom => rom.name.toLowerCase().includes(search));
            displayRoms(filtered);
        }

        /* ============================================================
           closeEmulator()
           ============================================================ */
        function closeEmulator() {
            document.getElementById('emulator-overlay').classList.remove('active');
            location.reload();
        }

        /* ============================================================
           formatFileSize(bytes)
           ============================================================ */
        function formatFileSize(bytes) {
            if (!bytes) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
    </script>
</body>
</html>
