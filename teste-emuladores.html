<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de ROMs - Cores Locais</title>
    <script src="https://cdn.jsdelivr.net/npm/nostalgist@0.19.2/dist/nostalgist.umd.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }
        h1 {
            font-size: 2.5em;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .subtitle { color: #888; margin-bottom: 15px; }
        .cores-info {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            font-size: 0.9em;
        }
        .cores-info strong { color: #00d4ff; }
        .controls {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .control-group label {
            font-size: 0.85em;
            color: #00d4ff;
            font-weight: bold;
        }
        .control-group select, .control-group input {
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 6px;
            color: #fff;
            font-size: 1em;
        }
        .roms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 15px;
        }
        .rom-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            transition: all 0.3s ease;
        }
        .rom-card:hover {
            border-color: #00d4ff;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.2);
        }
        .rom-system {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .system-neogeo { background: rgba(255, 107, 107, 0.3); color: #ff6b6b; }
        .system-cps { background: rgba(78, 205, 196, 0.3); color: #4ecdc4; }
        .system-midway { background: rgba(255, 230, 109, 0.3); color: #ffe66d; }
        .rom-name {
            font-size: 1.1em;
            font-weight: bold;
            color: #fff;
            margin-bottom: 8px;
            word-break: break-all;
        }
        .rom-size {
            font-size: 0.85em;
            color: #888;
            margin-bottom: 12px;
        }
        .test-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00d4ff, #7b2ff7);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .test-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.4);
        }
        #emulator-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.98);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #emulator-overlay.active { display: flex; }
        .close-btn {
            position: absolute;
            top: 20px; right: 20px;
            padding: 10px 20px;
            background: #ff4757;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            z-index: 10000;
        }
        .close-btn:hover { background: #ff6b7a; }
        .loading {
            color: #00d4ff;
            font-size: 1.5em;
            text-align: center;
        }
        .status-box {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 8px;
            color: #00d4ff;
            max-width: 700px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 0.85em;
            max-height: 400px;
            overflow-y: auto;
        }
        .status-box.error {
            background: rgba(255, 71, 87, 0.2);
            border-color: rgba(255, 71, 87, 0.5);
            color: #ff4757;
        }
        .status-box.success {
            background: rgba(40, 167, 69, 0.2);
            border-color: rgba(40, 167, 69, 0.5);
            color: #28a745;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(0, 212, 255, 0.5); border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 Teste de ROMs</h1>
            <p class="subtitle">Usando cores hospedados no repositório</p>
            
            <div class="cores-info">
                <strong>📦 Cores disponíveis:</strong><br>
                • FBNeo (FinalBurn Neo) - NeoGeo, CPS, Midway<br>
                • MAME 2003 - Arcade clássico<br>
                • MAME 2003 Plus - Arcade melhorado
            </div>
        </header>

        <div class="controls">
            <div class="control-group">
                <label>🔧 Selecionar Core</label>
                <select id="core-select">
                    <option value="fbneo">FBNeo (Recomendado)</option>
                    <option value="mame2003">MAME 2003</option>
                    <option value="mame2003_plus">MAME 2003 Plus</option>
                </select>
            </div>
            <div class="control-group">
                <label>🔍 Buscar ROM</label>
                <input type="text" id="search-rom" placeholder="Digite o nome..." onkeyup="filterRoms()">
            </div>
        </div>

        <div id="roms-container"></div>
    </div>

    <div id="emulator-overlay">
        <button class="close-btn" onclick="closeEmulator()">✕ FECHAR</button>
        <div class="loading" id="loading-text">Carregando...</div>
        <div class="status-box" id="status-box"></div>
    </div>

    <script>
        const REPO_BASE = 'https://raw.githubusercontent.com/Vdmtx/retroarchonline/main';
        const GITHUB_API = 'https://api.github.com/repos/Vdmtx/retroarchonline/contents';
        let allRoms = [];

        // Cores hospedados no repositório
        const CORES = {
            fbneo: {
                name: 'FBNeo',
                js: `${REPO_BASE}/data/cores/fbneo_libretro.js`,
                wasm: `${REPO_BASE}/data/cores/fbneo_libretro.wasm`,
                data: `${REPO_BASE}/data/cores/fbneo-wasm.data`
            },
            mame2003: {
                name: 'MAME 2003',
                js: `${REPO_BASE}/data/cores/mame2003_libretro.js`,
                wasm: `${REPO_BASE}/data/cores/mame2003_libretro.wasm`,
                data: `${REPO_BASE}/data/cores/mame2003-legacy-wasm.data`
            },
            mame2003_plus: {
                name: 'MAME 2003 Plus',
                js: `${REPO_BASE}/data/cores/mame2003_plus_libretro.js`,
                wasm: `${REPO_BASE}/data/cores/mame2003_plus_libretro.wasm`,
                data: `${REPO_BASE}/data/cores/mame2003_plus-legacy-wasm.data`
            }
        };

        window.addEventListener('DOMContentLoaded', async () => {
            await loadAllRoms();
        });

        async function loadAllRoms() {
            const systems = ['neogeo', 'cps', 'midway'];
            const container = document.getElementById('roms-container');
            container.innerHTML = '<div style="text-align: center; color: #00d4ff; padding: 40px;">Carregando ROMs...</div>';
            
            for (const system of systems) {
                try {
                    const response = await fetch(`${GITHUB_API}/roms/${system}`);
                    if (!response.ok) continue;
                    
                    const files = await response.json();
                    const roms = files.filter(f => f.type === 'file' && f.name.endsWith('.zip'));
                    
                    roms.forEach(rom => {
                        allRoms.push({
                            system: system,
                            name: rom.name,
                            size: rom.size
                        });
                    });
                } catch (e) {
                    console.error(`Erro ao carregar ${system}:`, e);
                }
            }
            
            displayRoms();
        }

        function displayRoms(roms = allRoms) {
            const container = document.getElementById('roms-container');
            
            if (roms.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #888; padding: 40px;">Nenhuma ROM encontrada</div>';
                return;
            }
            
            container.innerHTML = `<div class="roms-grid">${roms.map(rom => `
                <div class="rom-card" data-name="${rom.name.toLowerCase()}">
                    <div class="rom-system system-${rom.system}">${rom.system.toUpperCase()}</div>
                    <div class="rom-name">${rom.name.replace('.zip', '')}</div>
                    <div class="rom-size">${formatFileSize(rom.size)}</div>
                    <button class="test-btn" onclick="testRom('${rom.system}', '${rom.name}')">▶ TESTAR</button>
                </div>
            `).join('')}</div>`;
        }

        async function testRom(system, romFile) {
            const coreKey = document.getElementById('core-select').value;
            const core = CORES[coreKey];
            
            const overlay = document.getElementById('emulator-overlay');
            const statusBox = document.getElementById('status-box');
            
            overlay.classList.add('active');
            statusBox.classList.remove('error', 'success');
            
            let status = `🎮 Sistema: ${system.toUpperCase()}\n📦 ROM: ${romFile}\n🔧 Core: ${core.name}\n\n⏳ Verificando arquivos...`;
            statusBox.textContent = status;

            try {
                // URLs das ROMs e BIOS
                const romUrl = `${REPO_BASE}/roms/${system}/${encodeURIComponent(romFile)}`;
                let biosUrl = null;
                
                if (system === 'neogeo') {
                    biosUrl = `${REPO_BASE}/bios/neogeo.zip`;
                    status += '\n🔌 BIOS: neogeo.zip';
                } else if (system === 'cps') {
                    biosUrl = `${REPO_BASE}/bios/qsound.zip`;
                    status += '\n🔌 BIOS: qsound.zip';
                }
                
                statusBox.textContent = status;

                // Configuração do Nostalgist com cores locais
                const config = {
                    core: {
                        name: core.name,
                        js: core.js,
                        wasm: core.wasm
                    },
                    rom: romUrl
                };

                if (biosUrl) {
                    config.bios = biosUrl;
                }

                status += '\n\n🚀 Iniciando emulador...';
                statusBox.textContent = status;

                const nostalgist = await Nostalgist.launch(config);
                
                status += '\n\n✅ EMULADOR INICIADO COM SUCESSO!\n\n' +
                    '🎮 Controles:\n' +
                    '• Setas/WASD: Mover\n' +
                    '• X/Z: Botão A\n' +
                    '• C/A: Botão B\n' +
                    '• Enter: Start\n' +
                    '• Shift: Select\n' +
                    '• 5: Insert Coin\n\n' +
                    '💡 Use o menu do emulador para salvar/carregar';
                
                statusBox.classList.add('success');
                statusBox.textContent = status;

            } catch (error) {
                console.error('Erro:', error);
                statusBox.classList.add('error');
                statusBox.textContent = `❌ ERRO\n\nSistema: ${system}\nROM: ${romFile}\nCore: ${core.name}\n\nErro: ${error.message}\n\n🔍 URLs:\n• Core JS: ${core.js}\n• Core WASM: ${core.wasm}\n• ROM: ${romUrl}\n• BIOS: ${biosUrl || 'N/A'}\n\n💡 Possíveis causas:\n1. Arquivos .js/.wasm não existem na pasta /data/cores/\n2. ROM não encontrada\n3. BIOS ausente\n4. Problema de CORS`;
            }
        }

        function filterRoms() {
            const search = document.getElementById('search-rom').value.toLowerCase();
            const filtered = allRoms.filter(rom => rom.name.toLowerCase().includes(search));
            displayRoms(filtered);
        }

        function closeEmulator() {
            document.getElementById('emulator-overlay').classList.remove('active');
            location.reload();
        }

        function formatFileSize(bytes) {
            if (!bytes) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
    </script>
</body>
</html>
