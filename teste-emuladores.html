<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de ROMs - NJRBuild + FBNeo</title>
    <script src="https://cdn.jsdelivr.net/npm/nostalgist@0.19.2/dist/nostalgist.umd.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        
        header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }
        h1 {
            font-size: 2.5em;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .subtitle { color: #888; margin-bottom: 15px; }
        
        .emulator-info {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .emulator-info strong { color: #00d4ff; }
        .emulator-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            margin: 5px 5px 5px 0;
            font-weight: bold;
        }
        .badge-neogeo { background: rgba(255, 107, 107, 0.3); color: #ff6b6b; }
        .badge-cps { background: rgba(78, 205, 196, 0.3); color: #4ecdc4; }
        .badge-midway { background: rgba(255, 230, 109, 0.3); color: #ffe66d; }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }
        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stat-label { color: #888; margin-top: 5px; }
        
        .controls {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        .search-box {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 6px;
            color: #fff;
            font-size: 1em;
        }
        
        .roms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 15px;
        }
        .rom-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            transition: all 0.3s ease;
        }
        .rom-card:hover {
            border-color: #00d4ff;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.2);
        }
        .rom-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .rom-system {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
        }
        .system-neogeo { background: rgba(255, 107, 107, 0.3); color: #ff6b6b; }
        .system-cps { background: rgba(78, 205, 196, 0.3); color: #4ecdc4; }
        .system-midway { background: rgba(255, 230, 109, 0.3); color: #ffe66d; }
        
        .rom-name {
            font-size: 1.1em;
            font-weight: bold;
            color: #fff;
            margin-bottom: 8px;
            word-break: break-all;
        }
        .rom-size {
            font-size: 0.85em;
            color: #888;
            margin-bottom: 12px;
        }
        .test-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00d4ff, #7b2ff7);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .test-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.4);
        }
        
        #emulator-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.98);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #emulator-overlay.active { display: flex; }
        .close-btn {
            position: absolute;
            top: 20px; right: 20px;
            padding: 10px 20px;
            background: #ff4757;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1em;
            cursor: pointer;
            z-index: 10000;
        }
        .close-btn:hover { background: #ff6b7a; }
        .loading {
            color: #00d4ff;
            font-size: 1.5em;
            text-align: center;
        }
        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
        .status-box {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 8px;
            color: #00d4ff;
            max-width: 700px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 0.85em;
            max-height: 400px;
            overflow-y: auto;
        }
        .status-box.error {
            background: rgba(255, 71, 87, 0.2);
            border-color: rgba(255, 71, 87, 0.5);
            color: #ff4757;
        }
        .status-box.success {
            background: rgba(40, 167, 69, 0.2);
            border-color: rgba(40, 167, 69, 0.5);
            color: #28a745;
        }
        .loading-scan {
            text-align: center;
            padding: 60px 20px;
            color: #00d4ff;
        }
        .progress-bar {
            width: 100%;
            max-width: 400px;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin-top: 20px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 4px;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(0, 212, 255, 0.5); border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 Teste de ROMs</h1>
            <p class="subtitle">NJRBuild 2.5.27 (NeoGeo) + FBNeo (CPS/Midway)</p>
            
            <div class="emulator-info">
                <strong>🔧 Emuladores:</strong><br>
                <span class="emulator-badge badge-neogeo">NJRBuild 2.5.27</span>
                <span>→ Jogos NeoGeo</span><br><br>
                <span class="emulator-badge badge-cps">FBNeo</span>
                <span>→ Jogos CPS1/CPS2</span><br><br>
                <span class="emulator-badge badge-midway">FBNeo</span>
                <span>→ Jogos Midway</span>
            </div>
        </header>

        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-number" id="total-roms">0</div>
                <div class="stat-label">Total de ROMs</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="total-neogeo">0</div>
                <div class="stat-label">NeoGeo</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="total-cps">0</div>
                <div class="stat-label">CPS</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="total-midway">0</div>
                <div class="stat-label">Midway</div>
            </div>
        </div>

        <div class="controls">
            <input type="text" class="search-box" id="search-rom" placeholder="🔍 Buscar ROM..." onkeyup="filterRoms()">
        </div>

        <div id="roms-container">
            <div class="loading-scan">
                <div class="loading">Carregando ROMs</div>
                <p style="margin-top: 15px; color: #888;">Escaneando repositório...</p>
            </div>
        </div>
    </div>

    <div id="emulator-overlay">
        <button class="close-btn" onclick="closeEmulator()">✕ FECHAR</button>
        <div class="loading" id="loading-text">Carregando</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="status-box" id="status-box"></div>
    </div>

    <script>
        const REPO_BASE = 'https://raw.githubusercontent.com/Vdmtx/retroarchonline/main';
        const GITHUB_API = 'https://api.github.com/repos/Vdmtx/retroarchonline/contents';
        
        let allRoms = [];

        // NJRBuild 2.5.27 - Core para NeoGeo
        const NJRBUILD_CORE = {
            name: 'njrbuild',
            version: '2.5.27',
            js: 'https://cdn.jsdelivr.net/gh/nicbarker/njrbuild@main/dist/njrbuild_libretro.js',
            wasm: 'https://cdn.jsdelivr.net/gh/nicbarker/njrbuild@main/dist/njrbuild_libretro.wasm'
        };

        // FBNeo - Core para CPS e Midway
        const FBNEO_CORE = {
            name: 'fbneo',
            js: 'https://cdn.jsdelivr.net/gh/nicbarker/njrbuild@main/dist/fbneo_libretro.js',
            wasm: 'https://cdn.jsdelivr.net/gh/nicbarker/njrbuild@main/dist/fbneo_libretro.wasm'
        };

        window.addEventListener('DOMContentLoaded', async () => {
            await loadAllRoms();
        });

        async function loadAllRoms() {
            try {
                const systems = ['neogeo', 'cps', 'midway'];
                
                for (const system of systems) {
                    try {
                        const response = await fetch(`${GITHUB_API}/roms/${system}`);
                        if (!response.ok) {
                            console.warn(`Sistema ${system} não encontrado`);
                            continue;
                        }
                        
                        const files = await response.json();
                        const roms = files.filter(f => f.type === 'file' && f.name.endsWith('.zip'));
                        
                        roms.forEach(rom => {
                            allRoms.push({
                                system: system,
                                name: rom.name,
                                size: rom.size,
                                url: rom.download_url
                            });
                        });
                    } catch (e) {
                        console.error(`Erro ao carregar ${system}:`, e);
                    }
                }
                
                displayRoms();
                updateStats();
                
            } catch (error) {
                console.error('Erro:', error);
                document.getElementById('roms-container').innerHTML = `
                    <div style="text-align: center; color: #ff4757; padding: 40px;">
                        <h2> Erro ao carregar ROMs</h2>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        function displayRoms(roms = allRoms) {
            const container = document.getElementById('roms-container');
            
            if (roms.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #888; padding: 40px;">Nenhuma ROM encontrada</div>';
                return;
            }
            
            container.innerHTML = `
                <div class="roms-grid">
                    ${roms.map(rom => {
                        const systemClass = `system-${rom.system}`;
                        const emulatorName = rom.system === 'neogeo' ? 'NJRBuild 2.5.27' : 'FBNeo';
                        
                        return `
                            <div class="rom-card" data-name="${rom.name.toLowerCase()}" data-system="${rom.system}">
                                <div class="rom-header">
                                    <span class="rom-system ${systemClass}">${rom.system.toUpperCase()}</span>
                                    <span style="font-size: 0.8em; color: #888;">${emulatorName}</span>
                                </div>
                                <div class="rom-name">${rom.name.replace('.zip', '')}</div>
                                <div class="rom-size">${formatFileSize(rom.size)}</div>
                                <button class="test-btn" onclick="testRom('${rom.system}', '${rom.name}')">
                                    ▶ TESTAR COM ${emulatorName.toUpperCase()}
                                </button>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function filterRoms() {
            const search = document.getElementById('search-rom').value.toLowerCase();
            const filtered = allRoms.filter(rom => rom.name.toLowerCase().includes(search));
            displayRoms(filtered);
        }

        function updateStats() {
            document.getElementById('total-roms').textContent = allRoms.length;
            document.getElementById('total-neogeo').textContent = allRoms.filter(r => r.system === 'neogeo').length;
            document.getElementById('total-cps').textContent = allRoms.filter(r => r.system === 'cps').length;
            document.getElementById('total-midway').textContent = allRoms.filter(r => r.system === 'midway').length;
        }

        async function testRom(system, romFile) {
            const core = system === 'neogeo' ? NJRBUILD_CORE : FBNEO_CORE;
            
            const overlay = document.getElementById('emulator-overlay');
            const loadingText = document.getElementById('loading-text');
            const statusBox = document.getElementById('status-box');
            const progressFill = document.getElementById('progress-fill');
            
            overlay.classList.add('active');
            loadingText.style.display = 'block';
            statusBox.style.display = 'block';
            statusBox.classList.remove('error', 'success');
            progressFill.style.width = '0%';
            
            let status = `🎮 Sistema: ${system.toUpperCase()}\n📦 ROM: ${romFile}\n🔧 Core: ${core.name.toUpperCase()}\n\n⏳ Iniciando...`;
            updateStatus(status);
            setProgress(10);

            try {
                // Testar se o core existe antes de tentar carregar
                status += '\n\n🔍 Verificando core...';
                updateStatus(status);
                
                const coreJsResponse = await fetch(core.js, { method: 'HEAD' });
                if (!coreJsResponse.ok) {
                    throw new Error(`Core JS não encontrado: ${core.js}\nStatus: ${coreJsResponse.status}`);
                }
                setProgress(20);
                status += '\n✅ Core JS OK';
                updateStatus(status);

                const coreWasmResponse = await fetch(core.wasm, { method: 'HEAD' });
                if (!coreWasmResponse.ok) {
                    throw new Error(`Core WASM não encontrado: ${core.wasm}\nStatus: ${coreWasmResponse.status}`);
                }
                setProgress(30);
                status += '\n✅ Core WASM OK';
                updateStatus(status);

                // URLs via jsDelivr para evitar CORS
                const romUrl = `https://cdn.jsdelivr.net/gh/Vdmtx/retroarchonline@main/roms/${system}/${encodeURIComponent(romFile)}`;
                
                let biosUrl = null;
                if (system === 'neogeo') {
                    biosUrl = `https://cdn.jsdelivr.net/gh/Vdmtx/retroarchonline@main/bios/neogeo.zip`;
                    status += '\n🔌 BIOS: neogeo.zip';
                } else if (system === 'cps') {
                    biosUrl = `https://cdn.jsdelivr.net/gh/Vdmtx/retroarchonline@main/bios/qsound.zip`;
                    status += '\n🔌 BIOS: qsound.zip';
                }
                
                updateStatus(status);
                setProgress(40);

                // Testar ROM
                status += '\n\n📥 Verificando ROM...';
                updateStatus(status);
                const romResponse = await fetch(romUrl, { method: 'HEAD' });
                if (!romResponse.ok) {
                    throw new Error(`ROM não encontrada: ${romUrl}\nStatus: ${romResponse.status}`);
                }
                setProgress(60);
                status += '\n✅ ROM OK';
                updateStatus(status);

                // Testar BIOS se existir
                if (biosUrl) {
                    status += '\n📥 Verificando BIOS...';
                    updateStatus(status);
                    const biosResponse = await fetch(biosUrl, { method: 'HEAD' });
                    if (!biosResponse.ok) {
                        status += `\n⚠️ BIOS não encontrada (pode não ser necessária)`;
                    } else {
                        status += '\n✅ BIOS OK';
                    }
                    updateStatus(status);
                }
                setProgress(70);

                const launchConfig = {
                    core: {
                        name: core.name,
                        js: core.js,
                        wasm: core.wasm
                    },
                    rom: romUrl
                };

                if (biosUrl) {
                    launchConfig.bios = biosUrl;
                }

                status += '\n\n🚀 Carregando emulador...';
                updateStatus(status);
                setProgress(80);

                // Timeout de 30 segundos
                const timeoutPromise = new Promise((_, reject) => {
                    setTimeout(() => reject(new Error('Timeout: Emulador demorou mais de 30 segundos para carregar')), 30000);
                });

                const nostalgistPromise = Nostalgist.launch(launchConfig);
                const nostalgist = await Promise.race([nostalgistPromise, timeoutPromise]);
                
                setProgress(100);
                status += '\n\n✅ EMULADOR INICIADO COM SUCESSO!\n\n' +
                    '🎮 Controles:\n' +
                    '• Setas/WASD: Mover\n' +
                    '• X/Z: Botão A\n' +
                    '• C/A: Botão B\n' +
                    '• Enter: Start\n' +
                    '• Shift: Select\n' +
                    '• 5: Insert Coin\n\n' +
                    '💡 Use o menu do emulador para salvar/carregar';
                
                updateStatus(status, false, true);
                setTimeout(() => { loadingText.style.display = 'none'; }, 1500);

            } catch (error) {
                console.error('Erro completo:', error);
                setProgress(0);
                updateStatus(`❌ ERRO DETALHADO\n\nSistema: ${system}\nROM: ${romFile}\nCore: ${core.name}\n\nErro: ${error.message}\n\n🔍 URLs testadas:\n• Core JS: ${core.js}\n• Core WASM: ${core.wasm}\n• ROM: ${romUrl}\n• BIOS: ${biosUrl || 'N/A'}\n\n💡 Soluções:\n1. Verifique se o core existe no CDN\n2. Confirme que a ROM está no repositório\n3. Tente outro navegador`, true);
            }
        }

        function setProgress(percent) {
            document.getElementById('progress-fill').style.width = percent + '%';
        }

        function updateStatus(message, isError, isSuccess) {
            const statusBox = document.getElementById('status-box');
            statusBox.textContent = message;
            statusBox.classList.remove('error', 'success');
            if (isError) statusBox.classList.add('error');
            if (isSuccess) statusBox.classList.add('success');
        }

        function closeEmulator() {
            document.getElementById('emulator-overlay').classList.remove('active');
            location.reload();
        }

        function formatFileSize(bytes) {
            if (!bytes) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
    </script>
</body>
</html>
