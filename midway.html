<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🥋 Midway</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; color: #fff; font-family: Arial, sans-serif; padding: 20px; }
        h1 { color: #ff0088; text-align: center; margin-bottom: 20px; }
        .back-link { text-align: center; margin-bottom: 20px; }
        .back-link a { color: #00ff88; text-decoration: none; }
        .search-box { max-width: 600px; margin: 0 auto 30px; }
        .search-box input { width: 100%; padding: 12px; border: 2px solid #ff0088; border-radius: 25px; background: #1a1a2e; color: #fff; font-size: 16px; }
        .stats { text-align: center; color: #ff0088; margin-bottom: 20px; }
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; max-width: 1400px; margin: 0 auto; }
        .game-card { background: #1a1a2e; border: 2px solid #ff0088; border-radius: 12px; padding: 20px; cursor: pointer; text-align: center; transition: 0.3s; }
        .game-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(255,0,136,0.3); }
        .game-icon { font-size: 56px; margin-bottom: 15px; }
        #game-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; }
        #game { width: 100%; height: 100%; }
        #back-btn { position: fixed; top: 15px; left: 15px; z-index: 1001; background: #000; color: #fff; border: 2px solid #ff0088; padding: 12px 24px; cursor: pointer; font-weight: bold; }
        #error-msg { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: #ff0000; color: #fff; padding: 15px 30px; border-radius: 8px; display: none; z-index: 3000; }
    </style>
</head>
<body>
    <h1>🥋 MIDWAY</h1>
    <div class="back-link"><a href="index.html">← Voltar ao Menu</a></div>
    <div class="search-box"><input type="text" id="search" placeholder="🔍 Buscar jogos..." oninput="filtrarJogos()"></div>
    <div class="stats" id="stats"></div>
    <div class="game-grid" id="gameGrid"></div>
    <div id="game-container">
        <button id="back-btn" onclick="voltar()">← Voltar</button>
        <div id="game"></div>
    </div>
    <div id="error-msg"></div>

    <script>
        const ROMS_BASE = 'https://vdmtx.github.io/retroarchonline/roms/';
        let jogos = [];
        const MIDWAY_GAMES = ['mk', 'mortal', 'nba', 'nfl', 'cruisn', 'hydro', 'offroad', 'rampage', 'warfa', 'smlkstrm'];

        async function carregarJogos() {
            try {
                const response = await fetch('https://api.github.com/repos/Vdmtx/retroarchonline/contents/roms');
                const files = await response.json();
                jogos = files.filter(f => {
                    if (!f.name.endsWith('.zip')) return false;
                    const nome = f.name.toLowerCase();
                    return MIDWAY_GAMES.some(k => nome.includes(k));
                }).map(f => ({ nome: f.name.replace('.zip', ''), arquivo: f.name }))
                  .sort((a, b) => a.nome.localeCompare(b.nome));
                mostrarJogos(jogos);
            } catch (e) {
                console.error('Erro ao carregar jogos:', e);
                document.getElementById('gameGrid').innerHTML = '<div style="color:#f00;text-align:center;grid-column:1/-1;">Erro ao carregar jogos</div>';
            }
        }

        function mostrarJogos(lista) {
            document.getElementById('stats').textContent = `${lista.length} jogo(s) Midway`;
            document.getElementById('gameGrid').innerHTML = lista.map(j => `
                <div class="game-card" onclick="iniciarJogo('${j.arquivo}')">
                    <div class="game-icon">🥋</div>
                    <div>${j.nome}</div>
                </div>
            `).join('');
        }

        function filtrarJogos() {
            const busca = document.getElementById('search').value.toLowerCase();
            mostrarJogos(jogos.filter(j => j.nome.toLowerCase().includes(busca)));
        }

        function mostrarErro(msg) {
            const errDiv = document.getElementById('error-msg');
            errDiv.textContent = msg;
            errDiv.style.display = 'block';
            setTimeout(() => { errDiv.style.display = 'none'; }, 5000);
        }

        function iniciarJogo(arquivo) {
            console.log('🎮 Iniciando jogo:', arquivo);
            document.getElementById('game-container').style.display = 'block';
            
            const romUrl = ROMS_BASE + encodeURIComponent(arquivo);
            
            // Verificar se a ROM existe
            fetch(romUrl, {method: 'HEAD'})
                .then(r => {
                    if (!r.ok) {
                        throw new Error('ROM não encontrada: ' + r.status);
                    }
                    console.log('✅ ROM encontrada:', arquivo);
                    carregarEmulatorJS(arquivo);
                })
                .catch(e => {
                    console.error('❌ Erro:', e);
                    mostrarErro('❌ Erro ao carregar ROM: ' + e.message);
                    setTimeout(() => { document.getElementById('game-container').style.display = 'none'; }, 2000);
                });
        }

        function carregarEmulatorJS(arquivo) {
            const romUrl = ROMS_BASE + encodeURIComponent(arquivo);
            
            // Limpar configurações anteriores
            Object.keys(window).forEach(key => {
                if (key.startsWith('EJS_')) delete window[key];
            });
            document.getElementById('game').innerHTML = '';
            
            // Configurar EmulatorJS
            window.EJS_player = "#game";
            window.EJS_core = "fbneo";  // FBNeo funciona melhor para Midway
            window.EJS_gameUrl = romUrl;
            window.EJS_gameName = arquivo.replace('.zip', '');
            window.EJS_pathtodata = "https://cdn.emulatorjs.org/latest/data/";
            window.EJS_startOnLoaded = true;
            window.EJS_color = "#000000";
            
            console.log('📦 Carregando EmulatorJS...');
            console.log('🎮 ROM:', romUrl);
            console.log('⚙️ Core: fbneo');
            
            // Callback quando pronto
            window.EJS_ready = function() {
                console.log('✅ Jogo carregado com sucesso!');
            };
            
            // Callback de erro
            window.EJS_onGameStart = function() {
                console.log('🎮 Jogo iniciado!');
            };
            
            // Carregar script
            const script = document.createElement('script');
            script.src = "https://cdn.emulatorjs.org/latest/data/loader.js";
            
            script.onload = function() {
                console.log('✅ Loader carregado');
            };
            
            script.onerror = function() {
                console.error('❌ Erro ao carregar EmulatorJS');
                mostrarErro('❌ Erro ao carregar emulador');
            };
            
            document.body.appendChild(script);
            console.log('📝 Script adicionado');
        }

        function voltar() { location.reload(); }
        carregarJogos();
    </script>
</body>
</html>
