<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 Arcade Library</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--g:#00ff88;--gd:#00cc6a;--bg:#070a0f;--c1:#0d1117;--bd:#21262d}
body{background:var(--bg);color:#e6edf3;font-family:'Share Tech Mono',monospace;padding:24px 16px;min-height:100vh}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.06) 3px,rgba(0,0,0,.06) 4px);pointer-events:none;z-index:9999}
h1{font-family:'Press Start 2P',monospace;color:var(--g);text-align:center;font-size:clamp(11px,2.5vw,20px);text-shadow:0 0 24px rgba(0,255,136,.4);margin-bottom:6px}
.sub{text-align:center;color:#444;font-size:10px;letter-spacing:4px;margin-bottom:28px}
.search-wrap{max-width:480px;margin:0 auto 18px;position:relative}
.search-wrap input{width:100%;padding:11px 16px 11px 40px;background:var(--c1);border:1px solid var(--bd);border-radius:4px;color:#e6edf3;font-family:'Share Tech Mono',monospace;font-size:13px;outline:none;transition:border-color .2s}
.search-wrap input:focus{border-color:var(--g)}
.search-wrap::before{content:'⌕';position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#444;font-size:18px;pointer-events:none}
.stats{text-align:center;color:#30363d;font-size:10px;letter-spacing:3px;margin-bottom:22px}
.stats b{color:var(--g)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;max-width:1400px;margin:0 auto}
.card{background:var(--c1);border:1px solid var(--bd);border-radius:6px;padding:18px 12px;cursor:pointer;text-align:center;transition:transform .18s,border-color .18s,box-shadow .18s;user-select:none}
.card:hover{transform:translateY(-3px);border-color:var(--g);box-shadow:0 6px 20px rgba(0,255,136,.12)}
.card .ico{font-size:40px;margin-bottom:10px;line-height:1}
.card .name{font-size:9px;text-transform:uppercase;letter-spacing:.5px;line-height:1.5;color:#c9d1d9;margin-bottom:6px;word-break:break-word}
.card .sz{font-size:9px;color:#444}
#emu-wrap{display:none;position:fixed;inset:0;background:#000;z-index:1000}
#emu-wrap.on{display:block}
#back-btn{position:fixed;top:10px;left:10px;z-index:1002;background:rgba(0,0,0,.85);color:var(--g);border:1px solid var(--g);padding:8px 16px;border-radius:4px;cursor:pointer;font-family:'Share Tech Mono',monospace;font-size:11px;transition:background .18s,color .18s}
#back-btn:hover{background:var(--g);color:#000}
#emu-frame{width:100%;height:100%;border:none;background:#000;display:block}
#loading{display:none;position:fixed;inset:0;background:rgba(7,10,15,.97);z-index:2000;align-items:center;justify-content:center;flex-direction:column;gap:16px}
#loading.on{display:flex}
#loading h2{font-family:'Press Start 2P',monospace;color:var(--g);font-size:12px}
.bar{width:300px;height:20px;background:var(--c1);border:1px solid var(--g);border-radius:3px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--g),var(--gd));width:0%;transition:width .3s ease}
#st{font-size:10px;color:#666;letter-spacing:2px}
.msg{grid-column:1/-1;text-align:center;padding:48px 20px;font-size:11px;letter-spacing:2px;color:#444}
.msg.err{color:#f85149;background:#160b0b;border:1px solid #3d1010;border-radius:6px;padding:28px;line-height:2.2}
.msg.err a{color:var(--g)}
</style>
</head>
<body>

<h1>🎮 ARCADE LIBRARY</h1>
<p class="sub">EMULATORJS · FBNEO CORE</p>
<div class="search-wrap">
  <input id="search" type="text" placeholder="Search games..." oninput="doFilter()">
</div>
<div class="stats" id="stats"></div>
<div class="grid" id="grid"><div class="msg">⏳ FETCHING ROMS...</div></div>

<div id="loading">
  <h2>⚡ LOADING</h2>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <p id="st">PREPARING...</p>
</div>

<div id="emu-wrap">
  <button id="back-btn" onclick="goBack()">← BACK</button>
  <iframe id="emu-frame"
    allow="autoplay; fullscreen; gamepad"
    sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-popups allow-forms">
  </iframe>
</div>

<script>
/* ══ CONFIG ══
   ROM_BASE: GitHub Pages do seu repositório (deve estar ativo)
   EJS_DATA: mesmo data/ que o sf2prime.html usa — comprovadamente funciona com fbneo
*/
const REPO     = 'Vdmtx/retroarchonline';
const BRANCH   = 'main';
const ROM_DIR  = 'roms';
const ROM_BASE = 'https://vdmtx.github.io/retroarchonline/roms/';
const EJS_DATA = 'https://sf2prime.github.io/data/';
/* ════════════ */

let allGames = [], shown = [];

async function loadRoms() {
  try {
    const res = await fetch(
      `https://api.github.com/repos/${REPO}/contents/${ROM_DIR}?ref=${BRANCH}`,
      { headers: { Accept: 'application/vnd.github.v3+json' } }
    );
    if (!res.ok) {
      const j = await res.json().catch(()=>({}));
      throw new Error(j.message || `HTTP ${res.status}`);
    }
    const items = await res.json();
    if (!Array.isArray(items)) throw new Error(items.message || 'Resposta inesperada');

    allGames = items
      .filter(f => f.type === 'file' && /\.(zip|7z)$/i.test(f.name))
      .map(f => ({
        label  : prettify(f.name),
        file   : f.name,
        romName: f.name.replace(/\.(zip|7z)$/i, ''),
        url    : ROM_BASE + f.name,
        size   : f.size
      }));

    if (!allGames.length) throw new Error(
      `Nenhum .zip encontrado em "${ROM_DIR}".<br>` +
      `Itens presentes: ${items.map(f=>f.name).join(', ') || '(pasta vazia)'}`
    );

    shown = [...allGames];
    render();
  } catch(e) {
    document.getElementById('grid').innerHTML = `
      <div class="msg err">❌ ${e.message}<br>
        <a href="https://github.com/${REPO}/tree/${BRANCH}/${ROM_DIR}" target="_blank">
          → Ver pasta no GitHub
        </a>
      </div>`;
  }
}

function prettify(n) {
  return n.replace(/\.(zip|7z)$/i,'').replace(/[_\-.]+/g,' ')
          .replace(/\b\w/g,c=>c.toUpperCase()).trim();
}

function render() {
  const stats = document.getElementById('stats');
  const grid  = document.getElementById('grid');
  if (!shown.length) {
    grid.innerHTML = '<div class="msg">NO GAMES FOUND</div>';
    stats.innerHTML = '';
    return;
  }
  stats.innerHTML = `<b>${shown.length}</b> / ${allGames.length} GAMES`;
  grid.innerHTML = shown.map((g,i)=>
    `<div class="card" data-i="${i}" onclick="launch(this)">
       <div class="ico">🕹️</div>
       <div class="name">${g.label}</div>
       <div class="sz">${g.size?(g.size/1024/1024).toFixed(1)+' MB':'—'}</div>
     </div>`
  ).join('');
}

function doFilter() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  shown = q ? allGames.filter(g=>g.label.toLowerCase().includes(q)) : [...allGames];
  render();
}

function prog(pct, msg) {
  document.getElementById('loading').classList.add('on');
  document.getElementById('fill').style.width = pct+'%';
  document.getElementById('st').textContent = msg;
}
function hideProg() { document.getElementById('loading').classList.remove('on'); }

function launch(card) {
  const g = shown[+card.dataset.i];
  if (!g) return;

  prog(20, 'LOADING GAME...');

  /*
    PADRÃO EXATO do sf2prime.html que funciona:
    - EJS_core = "fbneo"  (sf2prime usa fbneo, sfz3mix usa arcade — depende do jogo)
    - EJS_gameUrl = URL completa do .zip no GitHub Pages
    - EJS_pathtodata = "https://sf2prime.github.io/data/"
    - Variáveis declaradas num <script> ANTES do <script src="loader.js">
    - loader.js como tag estática, não injetado dinamicamente

    Usamos srcdoc no iframe para isolar cada sessão e replicar
    a estrutura exata de uma página HTML dedicada ao jogo.
  */

  const gamepadJSON = JSON.stringify([
    {"type":"button","text":"4","id":"a","location":"right","right":145,"top":80,"bold":true,"input_value":0},
    {"type":"button","text":"5","id":"b","location":"right","right":75,"top":80,"bold":true,"input_value":8},
    {"type":"button","text":"6","id":"c","location":"right","right":5,"top":80,"bold":true,"input_value":11},
    {"type":"button","text":"1","id":"x","location":"right","right":145,"top":10,"bold":true,"input_value":1},
    {"type":"button","text":"2","id":"y","location":"right","right":75,"top":10,"bold":true,"input_value":9},
    {"type":"button","text":"3","id":"z","location":"right","right":5,"top":10,"bold":true,"input_value":10},
    {"type":"dpad","location":"left","left":"50%","right":"50%","joystickInput":false,"inputValues":[4,5,6,7]},
    {"type":"button","text":"Coin","id":"select","location":"center","left":-5,"fontSize":15,"block":true,"input_value":2},
    {"type":"button","text":"Start","id":"start","location":"center","left":60,"fontSize":15,"block":true,"input_value":3}
  ]);

  // HTML idêntico ao sf2prime.html — só muda gameName e gameUrl
  const html = `<html>
<head>
<style>
body,html{margin:0;padding:0;background:#000;width:100%;height:100%;overflow:hidden}
</style>
</head>
<body>
<div style="width:100%;height:100vh;max-width:100%">
<div id="game"></div>
</div>
<script>
EJS_player = "#game";
EJS_core = "fbneo";
EJS_gameName = "${g.romName}";
EJS_color = "#000000";
EJS_startOnLoaded = true;
EJS_fullscreenOnLoad = true;
EJS_pathtodata = "${EJS_DATA}";
EJS_gameUrl = "${g.url}";
EJS_VirtualGamepadSettings = ${gamepadJSON};
<\/script>
<script src="${EJS_DATA}loader.js"><\/script>
</body>
</html>`;

  const frame = document.getElementById('emu-frame');

  // Limpa iframe anterior antes de setar novo conteúdo
  frame.removeAttribute('srcdoc');
  frame.src = 'about:blank';

  // Pequeno delay para garantir limpeza antes de carregar novo jogo
  setTimeout(() => {
    frame.srcdoc = html;
    document.getElementById('emu-wrap').classList.add('on');
    frame.onload = () => {
      prog(80, 'STARTING...');
      setTimeout(hideProg, 2000);
    };
  }, 100);
}

function goBack() {
  const frame = document.getElementById('emu-frame');
  frame.srcdoc = '';
  frame.src = 'about:blank';
  document.getElementById('emu-wrap').classList.remove('on');
  hideProg();
}

loadRoms();
</script>
</body>
</html>
