<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Minha Biblioteca Arcade</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; color: #fff; font-family: Arial, sans-serif; padding: 20px; }
        h1 { color: #00ff88; text-align: center; margin-bottom: 20px; }
        .search-box { max-width: 600px; margin: 0 auto 30px; }
        .search-box input { width: 100%; padding: 12px; border: 2px solid #333; border-radius: 25px; background: #1a1a2e; color: #fff; font-size: 16px; }
        .stats { text-align: center; color: #00ff88; margin-bottom: 20px; }
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; max-width: 1400px; margin: 0 auto; }
        .game-card { background: #1a1a2e; border: 2px solid #333; border-radius: 12px; padding: 20px; cursor: pointer; text-align: center; transition: 0.3s; }
        .game-card:hover { border-color: #00ff88; transform: translateY(-5px); }
        .game-icon { font-size: 56px; margin-bottom: 15px; }
        #game-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; }
        #game { width: 100%; height: 100%; }
        #back-btn { position: fixed; top: 15px; left: 15px; z-index: 1001; background: #000; color: #fff; border: 2px solid #00ff88; padding: 12px 24px; cursor: pointer; font-weight: bold; z-index: 1002; }
        #back-btn:hover { background: #00ff88; color: #000; }
        
        /* Botão para fechar loading manualmente */
        #close-loading {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 1002;
            background: #ff0000;
            color: #fff;
            border: 2px solid #ff0000;
            padding: 12px 24px;
            cursor: pointer;
            font-weight: bold;
            display: none;
        }
        #close-loading:hover { background: #ff4444; }
        
        /* Tela de loading */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        #loading-screen.active { display: flex; }
        .loading-box {
            background: #000;
            border: 2px solid #00ff88;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
        }
        .loading-box h2 { color: #00ff88; margin-bottom: 20px; }
        .loading-box button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #ff0000;
            color: #fff;
            border: 2px solid #ff0000;
            cursor: pointer;
            font-size: 14px;
        }
        .loading-box button:hover { background: #ff4444; }
    </style>
</head>
<body>
    <h1>🎮 Minha Biblioteca Arcade</h1>
    <div class="search-box">
        <input type="text" id="search" placeholder="🔍 Buscar jogos..." oninput="filtrarJogos()">
    </div>
    <div class="stats" id="stats"></div>
    <div class="game-grid" id="gameGrid"></div>
    
    <!-- Tela de loading com botão para fechar -->
    <div id="loading-screen">
        <div class="loading-box">
            <h2>🎮 Carregando...</h2>
            <p>Aguarde o jogo carregar</p>
            <button onclick="fecharLoading()">✖ Fechar (se travar)</button>
        </div>
    </div>
    
    <div id="game-container">
        <button id="back-btn" onclick="voltar()">← Voltar</button>
        <div id="game"></div>
    </div>

    <script>
        const ROMS_BASE = 'https://vdmtx.github.io/retroarchonline/roms/';
        let jogos = [];

        async function carregarJogos() {
            const response = await fetch('https://api.github.com/repos/Vdmtx/retroarchonline/contents/roms');
            const files = await response.json();
            jogos = files.filter(f => f.name.endsWith('.zip')).map(f => ({
                nome: f.name.replace('.zip', ''),
                arquivo: f.name
            })).sort((a, b) => a.nome.localeCompare(b.nome));
            mostrarJogos(jogos);
        }

        function mostrarJogos(lista) {
            document.getElementById('stats').textContent = `${lista.length} jogo(s)`;
            document.getElementById('gameGrid').innerHTML = lista.map(j => `
                <div class="game-card" onclick="iniciarJogo('${j.arquivo}')">
                    <div class="game-icon">🕹️</div>
                    <div>${j.nome}</div>
                </div>
            `).join('');
        }

        function filtrarJogos() {
            const busca = document.getElementById('search').value.toLowerCase();
            mostrarJogos(jogos.filter(j => j.nome.toLowerCase().includes(busca)));
        }

        function iniciarJogo(arquivo) {
            // Mostrar tela de loading
            document.getElementById('loading-screen').classList.add('active');
            document.getElementById('game-container').style.display = 'block';
            
            window.EJS_player = "#game";
            window.EJS_core = "fbneo";
            window.EJS_gameUrl = ROMS_BASE + arquivo;
            window.EJS_pathtodata = "https://cdn.emulatorjs.org/latest/data/";
            window.EJS_startOnLoaded = true;
            
            // Quando o jogo estiver pronto, esconder loading
            window.EJS_ready = function() {
                setTimeout(() => {
                    document.getElementById('loading-screen').classList.remove('active');
                }, 2000);
            };
            
            // Timeout - esconde loading após 15 segundos
            setTimeout(() => {
                document.getElementById('loading-screen').classList.remove('active');
            }, 15000);
            
            const script = document.createElement('script');
            script.src = "https://cdn.emulatorjs.org/latest/data/loader.js";
            document.body.appendChild(script);
        }

        function fecharLoading() {
            document.getElementById('loading-screen').classList.remove('active');
        }

        function voltar() { location.reload(); }
        carregarJogos();
    </script>
</body>
</html>
