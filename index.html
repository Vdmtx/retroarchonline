<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 Arcade Library</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--g:#00ff88;--gd:#00cc6a;--bg:#070a0f;--c1:#0d1117;--bd:#21262d}
body{background:var(--bg);color:#e6edf3;font-family:'Share Tech Mono',monospace;padding:24px 16px;min-height:100vh}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.06)3px,rgba(0,0,0,.06)4px);pointer-events:none;z-index:9999}
h1{font-family:'Press Start 2P',monospace;color:var(--g);text-align:center;font-size:clamp(11px,2.5vw,20px);text-shadow:0 0 24px rgba(0,255,136,.4);margin-bottom:6px}
.sub{text-align:center;color:#444;font-size:10px;letter-spacing:4px;margin-bottom:28px}
.search-wrap{max-width:480px;margin:0 auto 14px;position:relative}
.search-wrap input{width:100%;padding:11px 16px 11px 40px;background:var(--c1);border:1px solid var(--bd);border-radius:4px;color:#e6edf3;font-family:'Share Tech Mono',monospace;font-size:13px;outline:none;transition:border-color .2s}
.search-wrap input:focus{border-color:var(--g)}
.search-wrap::before{content:'⌕';position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#444;font-size:18px;pointer-events:none}
.filter-row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.fbtn{background:var(--c1);border:1px solid var(--bd);border-radius:4px;padding:5px 10px;font-family:'Share Tech Mono',monospace;font-size:9px;color:#555;cursor:pointer;transition:all .15s;letter-spacing:1px}
.fbtn:hover,.fbtn.on{border-color:var(--g);color:var(--g)}
.stats{text-align:center;color:#30363d;font-size:10px;letter-spacing:3px;margin-bottom:18px}
.stats b{color:var(--g)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;max-width:1300px;margin:0 auto}
.card{background:var(--c1);border:1px solid var(--bd);border-radius:6px;padding:16px 10px;cursor:pointer;text-align:center;transition:transform .15s,border-color .15s,box-shadow .15s;user-select:none}
.card:hover{transform:translateY(-3px);border-color:var(--g);box-shadow:0 6px 20px rgba(0,255,136,.1)}
.card:active{transform:scale(.97)}
.card .ico{font-size:34px;margin-bottom:8px;line-height:1}
.card .name{font-size:9px;text-transform:uppercase;letter-spacing:.4px;line-height:1.5;color:#c9d1d9;margin-bottom:6px;word-break:break-word}
.badge{display:inline-block;padding:2px 5px;border-radius:3px;font-size:7px;letter-spacing:1px;font-weight:bold}
.b-ng {background:#ff440018;color:#ff6644;border:1px solid #ff440030}
.b-c1 {background:#0044ff18;color:#4488ff;border:1px solid #0044ff30}
.b-c2 {background:#aa00ff18;color:#cc44ff;border:1px solid #aa00ff30}
.b-c3 {background:#ff880018;color:#ffaa44;border:1px solid #ff880030}
.b-mw {background:#ffff0018;color:#cccc00;border:1px solid #ffff0030}
.b-fx {background:#00ff8818;color:#00ff88;border:1px solid #00ff8830}
#emu-wrap{display:none;position:fixed;inset:0;background:#000;z-index:1000}
#emu-wrap.on{display:block}
#back-btn{position:fixed;top:10px;left:10px;z-index:1002;background:rgba(0,0,0,.85);color:var(--g);border:1px solid var(--g);padding:8px 16px;border-radius:4px;cursor:pointer;font-family:'Share Tech Mono',monospace;font-size:11px;transition:background .15s,color .15s}
#back-btn:hover{background:var(--g);color:#000}
#emu-frame{width:100%;height:100%;border:none;background:#000;display:block}
#loading{display:none;position:fixed;inset:0;background:rgba(7,10,15,.97);z-index:2000;align-items:center;justify-content:center;flex-direction:column;gap:16px}
#loading.on{display:flex}
#loading h2{font-family:'Press Start 2P',monospace;color:var(--g);font-size:11px;text-align:center}
.bar{width:300px;height:18px;background:var(--c1);border:1px solid var(--g);border-radius:3px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--g),var(--gd));width:0%;transition:width .4s ease}
#st{font-size:10px;color:#555;letter-spacing:2px;text-align:center;max-width:280px;line-height:1.6}
.msg{grid-column:1/-1;text-align:center;padding:48px 20px;font-size:11px;color:#444;letter-spacing:2px}
.msg.err{color:#f85149;background:#160b0b;border:1px solid #3d1010;border-radius:6px;padding:28px;line-height:2}
.msg.err a{color:var(--g)}
</style>
</head>
<body>
<h1>🎮 ARCADE LIBRARY</h1>
<p class="sub">MULTI-SYSTEM · AUTO-DETECT</p>

<div class="search-wrap">
  <input id="search" type="text" placeholder="Search games..." oninput="doFilter()">
</div>
<div class="filter-row" id="filters"></div>
<div class="stats" id="stats"></div>
<div class="grid" id="grid"><div class="msg">⏳ FETCHING ROMS...</div></div>

<div id="loading">
  <h2>⚡ LOADING</h2>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <p id="st">PREPARING...</p>
</div>

<div id="emu-wrap">
  <button id="back-btn" onclick="goBack()">← BACK</button>
  <iframe id="emu-frame"
    allow="autoplay; fullscreen; gamepad"
    sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-popups allow-forms">
  </iframe>
</div>

<script>
const REPO      = 'Vdmtx/retroarchonline';
const BRANCH    = 'main';
const ROM_DIR   = 'roms';
const BASE      = 'https://vdmtx.github.io/retroarchonline/roms/';
const BIOS_BASE = 'https://vdmtx.github.io/retroarchonline/bios/';

// sf2prime tem fbneo otimizado
const EJS_FBNEO = 'https://sf2prime.github.io/data/';
// EmulatorJS oficial tem mame2003, mame2010 e outros cores
const EJS_FULL  = 'https://cdn.emulatorjs.org/stable/data/';
// fallback: usa EJS_FULL para tudo se precisar
const EJS_DATA  = EJS_FBNEO;

const NEOGEO_BIOS = BIOS_BASE + 'neogeo.zip';

/* ══ TABELA DE SISTEMAS ══
   Cada ROM é comparada pelo início do nome (sem extensão).
   Ordem importa: mais específico primeiro.
*/
const SYSTEMS = [
  { id:'cps3',   label:'CPS-3',   cls:'b-c3', core:'fbneo',        bios:false, ejsData:EJS_FBNEO,
    match: n => /^(sfiii|sfiii2|sfiii3|jojo|jojoba|redearth|warzard)/.test(n) },
  { id:'cps2',   label:'CPS-2',   cls:'b-c2', core:'fbneo',        bios:false, ejsData:EJS_FBNEO,
    match: n => /^(sfz|sfa|sf2prime|hsf2|ssf2|msh|mvc|xmcota|xmvsf|nwarr|vsav|dstlk|sgemf|19xx|1944|progear|ddtod|cybots|gigawing|mars|mmatrix|mpang|qndream|spf2|batcir|choko|dimahoo|ecofghtr|hypreact|jyangoku|kaiserkn|ringdest|stdrag|savagere)/.test(n) },
  { id:'cps1',   label:'CPS-1',   cls:'b-c1', core:'fbneo',        bios:false, ejsData:EJS_FBNEO,
    match: n => /^(sf2|ghoul|strider|ffight|1941|mercs|mtwins|cawing|nemo|varth|wof|dino|punisher|slammast|captcomm|knights|megaman|rockman|pnickj|qad)/.test(n) },
  { id:'midway', label:'MIDWAY',  cls:'b-mw', core:'mame2003_plus', bios:false, ejsData:EJS_FULL,
    match: n => /^(mk|umk|nbajam|nbahan|openice|revx|wwfmania|term|narc|trog|smashtv|totcarn|hiimpact|strkforc|sspirit)/.test(n) },
  { id:'neogeo', label:'NEO GEO', cls:'b-ng', core:'fbneo',        bios:true,  ejsData:EJS_FBNEO,
    match: n => /^(kof|mslug|samsho|samsh|garou|rbff|fatfur|aof|lastblad|lastbld|matrim|svc|kf10|blazstar|shocktr|sengoku|spinmast|wjammer|kabukikl|magdrop|nam1975|turfmast|viewpoin|wh1|ncommand|alpham2|lresort|eightman|2020bb|ssideki|kotm|gpilots|joyjoy|pbobble|pspike|superspy|trally|bstar|tpgolf|legend|maglord|ridhero|roboarmy|socbrawl|timescan|twinspri|vliner|puzzledp|mutnat|zedblade|neodrift|neomrdo|ninjamas|pulstar|breaker|doubledr|savagere|whp|zintrick)/.test(n) },
  { id:'fbneo',  label:'ARCADE',  cls:'b-fx', core:'fbneo',        bios:false, ejsData:EJS_FBNEO,
    match: () => true }
];

function detectSys(filename) {
  const n = filename.toLowerCase().replace(/\.(zip|7z)$/,'');
  return SYSTEMS.find(s => s.match(n));
}

function prettify(name) {
  return name.replace(/\.(zip|7z)$/i,'').replace(/[_\-.]+/g,' ')
             .replace(/\b\w/g,c=>c.toUpperCase()).trim();
}

// Nomes de arquivos a excluir (BIOS, saves, etc)
const EXCLUDE = /^(neogeo|neogeo2|pgm|isgsm|meu_jogo)/i;

let allGames = [], shown = [];
let activeFilter = 'ALL';

async function loadRoms() {
  try {
    const res = await fetch(
      `https://api.github.com/repos/${REPO}/contents/${ROM_DIR}?ref=${BRANCH}`,
      { headers:{ Accept:'application/vnd.github.v3+json' } }
    );
    if (!res.ok) {
      const j = await res.json().catch(()=>({}));
      throw new Error(j.message || `HTTP ${res.status}`);
    }
    const items = await res.json();
    if (!Array.isArray(items)) throw new Error(items.message || 'Resposta inesperada da API');

    allGames = items
      .filter(f =>
        f.type === 'file' &&
        /\.(zip|7z)$/i.test(f.name) &&
        !EXCLUDE.test(f.name.replace(/\.(zip|7z)$/i,''))
      )
      .map(f => ({
        label  : prettify(f.name),
        file   : f.name,
        romName: f.name.replace(/\.(zip|7z)$/i,''),
        url    : BASE + encodeURIComponent(f.name),
        size   : f.size,
        broken : /\.7z$/i.test(f.name),
        sys    : detectSys(f.name)
      }))
      .sort((a,b) => a.label.localeCompare(b.label));

    if (!allGames.length) throw new Error(`Nenhuma ROM encontrada em "${ROM_DIR}"`);

    // Constrói filtros dinamicamente com os sistemas presentes
    const sysIds = ['ALL', ...new Set(allGames.map(g=>g.sys.id))];
    document.getElementById('filters').innerHTML = sysIds.map(id => {
      const sys = SYSTEMS.find(s=>s.id===id);
      return `<button class="fbtn${id==='ALL'?' on':''}" data-s="${id}" onclick="setFilter('${id}')">
        ${id==='ALL'?'ALL':sys?.label||id}
      </button>`;
    }).join('');

    shown = [...allGames];
    render();

  } catch(e) {
    document.getElementById('grid').innerHTML =
      `<div class="msg err">❌ ${e.message}<br>
       <a href="https://github.com/${REPO}/tree/${BRANCH}/${ROM_DIR}" target="_blank">→ Ver pasta no GitHub</a>
       </div>`;
  }
}

function setFilter(s) {
  activeFilter = s;
  document.querySelectorAll('.fbtn').forEach(b => b.classList.toggle('on', b.dataset.s===s));
  doFilter();
}

function doFilter() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  shown = allGames.filter(g => {
    const okF = activeFilter==='ALL' || g.sys.id===activeFilter;
    const okS = !q || g.label.toLowerCase().includes(q) || g.romName.toLowerCase().includes(q);
    return okF && okS;
  });
  render();
}

function render() {
  const grid  = document.getElementById('grid');
  const stats = document.getElementById('stats');
  if (!shown.length) {
    grid.innerHTML  = '<div class="msg">NO GAMES FOUND</div>';
    stats.innerHTML = '';
    return;
  }
  stats.innerHTML = `<b>${shown.length}</b> / ${allGames.length} GAMES`;
  grid.innerHTML  = shown.map((g,i) =>
    `<div class="card" data-i="${i}" onclick="launch(this)"
          style="${g.broken?'opacity:.4;cursor:not-allowed':''}">
       <div class="ico">${g.broken?'⚠️':'🕹️'}</div>
       <div class="name">${g.label}</div>
       <span class="badge ${g.sys.cls}">${g.sys.label}</span>
     </div>`
  ).join('');
}

/* ══ Loading ══ */
function prog(pct,msg){
  document.getElementById('loading').classList.add('on');
  document.getElementById('fill').style.width=pct+'%';
  document.getElementById('st').textContent=msg;
}
function hideProg(){ document.getElementById('loading').classList.remove('on'); }


const GAMEPAD = JSON.stringify([
  {"type":"button","text":"4","id":"a","location":"right","right":145,"top":80,"bold":true,"input_value":0},
  {"type":"button","text":"5","id":"b","location":"right","right":75,"top":80,"bold":true,"input_value":8},
  {"type":"button","text":"6","id":"c","location":"right","right":5,"top":80,"bold":true,"input_value":11},
  {"type":"button","text":"1","id":"x","location":"right","right":145,"top":10,"bold":true,"input_value":1},
  {"type":"button","text":"2","id":"y","location":"right","right":75,"top":10,"bold":true,"input_value":9},
  {"type":"button","text":"3","id":"z","location":"right","right":5,"top":10,"bold":true,"input_value":10},
  {"type":"dpad","location":"left","left":"50%","right":"50%","joystickInput":false,"inputValues":[4,5,6,7]},
  {"type":"button","text":"Coin","id":"select","location":"center","left":-5,"fontSize":15,"block":true,"input_value":2},
  {"type":"button","text":"Start","id":"start","location":"center","left":60,"fontSize":15,"block":true,"input_value":3}
]);

function launch(card) {
  const g = shown[+card.dataset.i];
  if (!g) return;
  if (g.broken) {
    alert(`⚠️ ${g.label}\n\nArquivo .7z não suportado.\nConverta para .zip e substitua no repositório.`);
    return;
  }

  prog(30, 'LOADING ' + g.label.toUpperCase() + '...');

  // URL direta do GitHub Pages — mesmo padrão que sf2prime usa
  // GitHub Pages serve com CORS aberto, o EmulatorJS consegue buscar
  const romUrl  = BASE + g.file;
  const ejsData = g.sys.ejsData;

  const biosLines = g.sys.bios ? `
EJS_biosUrl        = "${NEOGEO_BIOS}";
EJS_gameParentUrl  = "${NEOGEO_BIOS}";
EJS_AdditionalRoms = [{"name":"neogeo.zip","url":"${NEOGEO_BIOS}"}];` : '';

  const html = `<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>*{margin:0;padding:0}body,html{background:#000;width:100%;height:100%;overflow:hidden}#game{width:100%;height:100vh}</style>
</head><body>
<div id="game"></div>
<script>
EJS_player           = "#game";
EJS_core             = "${g.sys.core}";
EJS_gameName         = "${g.romName}";
EJS_gameUrl          = "${romUrl}";
EJS_pathtodata       = "${ejsData}";
EJS_color            = "#000000";
EJS_startOnLoaded    = true;
EJS_fullscreenOnLoad = true;
${biosLines}
EJS_VirtualGamepadSettings = ${GAMEPAD};
<\/script>
<script src="${ejsData}loader.js"><\/script>
</body></html>`;

  const frame = document.getElementById('emu-frame');
  frame.src = 'about:blank';
  setTimeout(() => {
    frame.srcdoc = html;
    document.getElementById('emu-wrap').classList.add('on');
    frame.onload = () => { prog(80,'STARTING...'); setTimeout(hideProg, 3000); };
  }, 100);
}

function goBack() {
  const frame = document.getElementById('emu-frame');
  frame.srcdoc = '';
  frame.src    = 'about:blank';
  document.getElementById('emu-wrap').classList.remove('on');
  hideProg();
}

loadRoms();
</script>
</body>
    </html>
