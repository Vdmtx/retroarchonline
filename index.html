<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Minha Biblioteca Arcade</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }
        .header {
            background: rgba(0,0,0,0.8);
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #00ff88;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 { color: #00ff88; font-size: 28px; }
        .header p { color: #888; margin-top: 5px; font-size: 14px; }
        
        /* Debug Panel */
        .debug-panel {
            background: rgba(255,0,0,0.1);
            border: 2px solid #ff4444;
            border-radius: 8px;
            padding: 15px;
            margin: 20px auto;
            max-width: 800px;
        }
        .debug-panel h3 {
            color: #ff4444;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .debug-panel ul {
            list-style: none;
            padding-left: 0;
        }
        .debug-panel li {
            padding: 5px 0;
            color: #ff8888;
            font-size: 14px;
        }
        .debug-panel li::before {
            content: "⚠️ ";
        }
        
        .status-panel {
            background: rgba(0,255,136,0.1);
            border: 2px solid #00ff88;
            border-radius: 8px;
            padding: 15px;
            margin: 20px auto;
            max-width: 800px;
        }
        .status-panel h3 {
            color: #00ff88;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .status-panel li::before {
            content: "✅ ";
        }
        
        .search-box { max-width: 600px; margin: 20px auto; padding: 0 20px; }
        .search-box input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #333;
            border-radius: 25px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        .search-box input:focus { border-color: #00ff88; }
        
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .game-card {
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            border: 2px solid #333;
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }
        .game-card:hover {
            transform: translateY(-5px);
            border-color: #00ff88;
            box-shadow: 0 10px 30px rgba(0,255,136,0.3);
        }
        .game-card.cached { border-color: #00ff88; }
        .game-card.cached::after {
            content: '✓';
            position: absolute;
            top: 10px; right: 10px;
            background: #00ff88;
            color: #000;
            width: 24px; height: 24px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold;
        }
        .game-card.missing {
            opacity: 0.5;
            border-color: #ff4444;
            cursor: not-allowed;
        }
        .game-icon {
            width: 100%; height: 120px;
            background: rgba(0,0,0,0.5);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 48px;
            margin-bottom: 10px;
        }
        .game-title {
            font-size: 14px; font-weight: bold;
            text-align: center;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .game-size { font-size: 12px; color: #888; text-align: center; margin-top: 5px; }
        .game-status { 
            font-size: 11px; 
            text-align: center; 
            margin-top: 5px;
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
        }
        .status-ok { color: #00ff88; }
        .status-error { color: #ff4444; }
        
        #game-container {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            z-index: 1000;
        }
        #game { width: 100%; height: 100%; }
        #back-btn {
            position: fixed;
            top: 10px; left: 10px;
            z-index: 1001;
            background: rgba(0,0,0,0.8);
            color: #fff;
            border: 2px solid #00ff88;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        #back-btn:hover { background: #00ff88; color: #000; }
        
        #loading {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            flex-direction: column;
            justify-content: center; align-items: center;
        }
        #loading h2 { color: #00ff88; margin-bottom: 20px; }
        .progress-bar {
            width: 80%; max-width: 400px;
            height: 30px;
            background: #1a1a2e;
            border: 2px solid #00ff88;
            border-radius: 5px;
            overflow: hidden;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff88, #00cc6a);
            width: 0%;
            transition: width 0.3s;
        }
        .progress-text {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-weight: bold; color: #000;
        }
        #status { margin-top: 15px; color: #888; }
        .stats { text-align: center; padding: 10px; color: #888; font-size: 14px; }
        .loading-text { text-align: center; padding: 40px; color: #00ff88; font-size: 18px; }
        
        .test-btn {
            margin-top: 10px;
            padding: 8px 16px;
            background: #00ff88;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        .test-btn:hover { background: #00cc6a; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎮 Minha Biblioteca Arcade</h1>
        <p>Diagnóstico completo dos arquivos</p>
    </div>

    <div id="diagnosticos"></div>

    <div class="search-box">
        <input type="text" id="search" placeholder="🔍 Buscar jogos..." oninput="filtrarJogos()">
    </div>

    <div class="stats" id="stats"></div>
    <div class="game-grid" id="gameGrid">
        <div class="loading-text">🔄 Escaneando pasta roms...</div>
    </div>

    <div id="loading">
        <h2>🎮 Carregando...</h2>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
            <div class="progress-text" id="progressText">0%</div>
        </div>
        <div id="status">Preparando...</div>
    </div>

    <div id="game-container">
        <button id="back-btn" onclick="voltar()">← Voltar</button>
        <div id="game"></div>
    </div>

    <script>
        // CONFIGURAÇÕES
        const REPO_OWNER = "Vdmtx";
        const REPO_NAME = "retroarchonline";
        const ROMS_PATH = "roms";
        const BASE_URL = `https://${REPO_OWNER}.github.io/${REPO_NAME}/${ROMS_PATH}/`;
        
        let jogos = [];
        let arquivosDisponiveis = new Set();
        let db;
        const DB_NAME = 'ArcadeCache';
        const STORE_NAME = 'roms';

        // IndexedDB
        async function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => { db = request.result; resolve(db); };
                request.onupgradeneeded = (e) => {
                    const database = e.target.result;
                    if (!database.objectStoreNames.contains(STORE_NAME)) {
                        database.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
            });
        }

        async function salvarCache(id, blob) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction([STORE_NAME], 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                const req = store.put({ id, blob, timestamp: Date.now() });
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }

        async function buscarCache(id) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction([STORE_NAME], 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const req = store.get(id);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        // Listar arquivos via GitHub API
        async function listarJogos() {
            const diagnosticosDiv = document.getElementById('diagnosticos');
            const grid = document.getElementById('gameGrid');
            
            try {
                const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${ROMS_PATH}`;
                const response = await fetch(apiUrl);
                
                if (!response.ok) throw new Error('Erro ao listar arquivos');
                
                const files = await response.json();
                
                // Criar lista de arquivos disponíveis
                files.forEach(file => {
                    if (file.name.toLowerCase().endsWith('.zip')) {
                        arquivosDisponiveis.add(file.name.toLowerCase());
                    }
                });
                
                // Verificar BIOS essenciais
                const biosNecessarias = ['neogeo.zip'];
                const biosFaltantes = [];
                const biosEncontradas = [];
                
                biosNecessarias.forEach(bios => {
                    if (arquivosDisponiveis.has(bios.toLowerCase())) {
                        biosEncontradas.push(bios);
                    } else {
                        biosFaltantes.push(bios);
                    }
                });
                
                // Mostrar diagnósticos
                let htmlDiagnosticos = '';
                
                if (biosFaltantes.length > 0) {
                    htmlDiagnosticos += `
                        <div class="debug-panel">
                            <h3>⚠️ BIOS Faltantes (CRÍTICO)</h3>
                            <ul>
                                ${biosFaltantes.map(b => `<li><strong>${b}</strong> - Necessária para jogos NeoGeo (KOF, Metal Slug, etc.)</li>`).join('')}
                            </ul>
                            <p style="color: #ff8888; font-size: 13px; margin-top: 10px;">
                                💡 <strong>Solução:</strong> Faça upload do arquivo ${biosFaltantes.join(', ')} na pasta roms/
                            </p>
                        </div>
                    `;
                }
                
                if (biosEncontradas.length > 0) {
                    htmlDiagnosticos += `
                        <div class="status-panel">
                            <h3>✅ BIOS Encontradas</h3>
                            <ul>
                                ${biosEncontradas.map(b => `<li><strong>${b}</strong></li>`).join('')}
                            </ul>
                        </div>
                    `;
                }
                
                htmlDiagnosticos += `
                    <div class="status-panel">
                        <h3>📁 Resumo</h3>
                        <p style="color: #fff; font-size: 14px;">
                            Total de arquivos na pasta roms: <strong style="color: #00ff88">${files.length}</strong><br>
                            Arquivos ZIP encontrados: <strong style="color: #00ff88">${arquivosDisponiveis.size}</strong><br>
                            URL base: <code style="background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 3px;">${BASE_URL}</code>
                        </p>
                        <button class="test-btn" onclick="testarDownload('neogeo.zip')" style="margin-top: 10px;">
                            🧪 Testar download neogeo.zip
                        </button>
                    </div>
                `;
                
                diagnosticosDiv.innerHTML = htmlDiagnosticos;
                
                // Criar lista de jogos
                jogos = files
                    .filter(file => file.name.toLowerCase().endsWith('.zip'))
                    .map(file => {
                        const nomeLimpo = file.name.replace(/\.zip$/i, '').replace(/[_-]/g, ' ');
                        const temBIOS = !nomeLimpo.toLowerCase().includes('neogeo');
                        
                        return {
                            nome: nomeLimpo,
                            arquivo: file.name,
                            sistema: 'fbneo',
                            tamanho: file.size,
                            disponivel: true,
                            temBIOS: temBIOS || arquivosDisponiveis.has('neogeo.zip')
                        };
                    });
                
                renderizarJogos();
            } catch (error) {
                console.error('Erro:', error);
                grid.innerHTML = `
                    <div class="loading-text" style="color: #ff4444;">
                        ❌ Erro ao carregar jogos<br>
                        <small>${error.message}</small><br><br>
                        Verifique se a pasta "roms" existe no repositório<br>
                        URL tentada: <code>${BASE_URL}</code>
                    </div>`;
            }
        }

        // Testar download direto
        async function testarDownload(arquivo) {
            const url = `${BASE_URL}${arquivo}`;
            alert(`🧪 Testando download:\n\nURL: ${url}\n\nClique em OK para tentar baixar...\n\nSe falhar, o arquivo não está acessível via GitHub Pages.`);
            
            try {
                const response = await fetch(url);
                if (response.ok) {
                    const blob = await response.blob();
                    alert(`✅ SUCESSO!\n\nArquivo: ${arquivo}\nTamanho: ${(blob.size/1024/1024).toFixed(2)} MB\n\nO arquivo está acessível e íntegro.`);
                } else {
                    alert(`❌ ERRO ${response.status}\n\nO arquivo não pôde ser baixado.\n\nPossíveis causas:\n- GitHub ainda não processou o upload\n- Arquivo corrompido\n- Limite de 100MB excedido`);
                }
            } catch (error) {
                alert(`❌ ERRO DE REDE\n\n${error.message}\n\nVerifique sua conexão ou tente novamente.`);
            }
        }

        // Download com progresso
        async function baixarComProgresso(arquivo, jogoId) {
            const loading = document.getElementById('loading');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            const status = document.getElementById('status');
            
            loading.style.display = 'flex';
            status.textContent = 'Verificando cache...';

            const cached = await buscarCache(jogoId);
            if (cached) {
                status.textContent = 'Carregando do cache...';
                progressFill.style.width = '100%';
                progressText.textContent = '100%';
                await new Promise(r => setTimeout(r, 500));
                loading.style.display = 'none';
                return URL.createObjectURL(cached.blob);
            }

            status.textContent = 'Baixando ROM...';
            const url = `${BASE_URL}${encodeURIComponent(arquivo)}`;
            
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: Arquivo não encontrado em ${url}`);
                }
                
                const contentLength = response.headers.get('content-length');
                const total = parseInt(contentLength, 10);
                let loaded = 0;

                const reader = response.body.getReader();
                const stream = new ReadableStream({
                    start(controller) {
                        function push() {
                            reader.read().then(({ done, value }) => {
                                if (done) { controller.close(); return; }
                                loaded += value.length;
                                if (total) {
                                    const percent = Math.round((loaded / total) * 100);
                                    progressFill.style.width = percent + '%';
                                    progressText.textContent = percent + '%';
                                    status.textContent = `Baixando: ${(loaded/1024/1024).toFixed(1)}MB / ${(total/1024/1024).toFixed(1)}MB`;
                                }
                                controller.enqueue(value);
                                push();
                            });
                        }
                        push();
                    }
                });

                const blob = await new Response(stream).blob();
                await salvarCache(jogoId, blob);
                
                status.textContent = 'Pronto!';
                await new Promise(r => setTimeout(r, 500));
                loading.style.display = 'none';
                
                return URL.createObjectURL(blob);
            } catch (error) {
                alert(`❌ Erro ao baixar ${arquivo}:\n\n${error.message}\n\nVerifique se o arquivo existe em:\n${BASE_URL}${arquivo}`);
                loading.style.display = 'none';
                return null;
            }
        }

        // Renderizar jogos
        async function renderizarJogos(lista = jogos) {
            const grid = document.getElementById('gameGrid');
            const stats = document.getElementById('stats');
            grid.innerHTML = '';
            
            if (lista.length === 0) {
                grid.innerHTML = '<div class="loading-text">Nenhum jogo encontrado</div>';
                return;
            }
            
            let cachedCount = 0;
            let comBIOS = 0;
            let semBIOS = 0;
            
            for (const jogo of lista) {
                const cached = await buscarCache(jogo.nome);
                if (cached) cachedCount++;
                
                if (jogo.temBIOS) comBIOS++; else semBIOS++;
                
                const card = document.createElement('div');
                card.className = 'game-card' + (cached ? ' cached' : '') + (!jogo.temBIOS ? ' missing' : '');
                
                const statusBadge = jogo.temBIOS 
                    ? '<span class="game-status status-ok">Pronto</span>'
                    : '<span class="game-status status-error">Falta BIOS</span>';
                
                card.innerHTML = `
                    <div class="game-icon">🕹️</div>
                    <div class="game-title">${jogo.nome}</div>
                    <div class="game-size">${jogo.sistema.toUpperCase()} • ${(jogo.tamanho/1024/1024).toFixed(1)}MB</div>
                    ${statusBadge}
                `;
                
                if (jogo.temBIOS) {
                    card.onclick = () => carregarJogo(jogo);
                } else {
                    card.title = "Este jogo requer neogeo.zip - Adicione na pasta roms/";
                }
                
                grid.appendChild(card);
            }
            
            stats.innerHTML = `
                ${lista.length} jogos • 
                ${cachedCount} em cache • 
                <span style="color: #00ff88">${comBIOS} prontos</span> • 
                <span style="color: #ff4444">${semBIOS} sem BIOS</span>
            `;
        }

        // Filtrar jogos
        function filtrarJogos() {
            const busca = document.getElementById('search').value.toLowerCase();
            const filtrados = jogos.filter(j => j.nome.toLowerCase().includes(busca));
            renderizarJogos(filtrados);
        }

        // Carregar jogo
        async function carregarJogo(jogo) {
            if (!jogo.temBIOS && !jogo.arquivo.toLowerCase().includes('neogeo')) {
                alert('⚠️ Este jogo requer a BIOS neogeo.zip!\n\nAdicione o arquivo na pasta roms/ e tente novamente.');
                return;
            }
            
            const blobUrl = await baixarComProgresso(jogo.arquivo, jogo.nome);
            if (!blobUrl) return;

            document.getElementById('game-container').style.display = 'block';
            document.getElementById('back-btn').style.display = 'block';
            document.body.style.overflow = 'hidden';

            EJS_player = "#game";
            EJS_core = jogo.sistema;
            EJS_gameName = jogo.nome.replace(/\s+/g, '').toLowerCase();
            EJS_color = "#000000";
            EJS_startOnLoaded = true;
            EJS_fullscreenOnLoad = false;
            EJS_pathtodata = "https://sf2prime.github.io/data/";
            EJS_gameUrl = blobUrl;
            EJS_VirtualGamepadSettings = [
                {"type":"button","text":"A","id":"a","location":"right","right":145,"top":80,"bold":true,"input_value":0},
                {"type":"button","text":"B","id":"b","location":"right","right":75,"top":80,"bold":true,"input_value":8},
                {"type":"button","text":"C","id":"c","location":"right","right":5,"top":80,"bold":true,"input_value":11},
                {"type":"button","text":"X","id":"x","location":"right","right":145,"top":10,"bold":true,"input_value":1},
                {"type":"button","text":"Y","id":"y","location":"right","right":75,"top":10,"bold":true,"input_value":9},
                {"type":"button","text":"Z","id":"z","location":"right","right":5,"top":10,"bold":true,"input_value":10},
                {"type":"dpad","location":"left","left":"50%","right":"50%","joystickInput":false,"inputValues":[4,5,6,7]},
                {"type":"button","text":"Coin","id":"select","location":"center","left":-5,"fontSize":15,"block":true,"input_value":2},
                {"type":"button","text":"Start","id":"start","location":"center","left":60,"fontSize":15,"block":true,"input_value":3}
            ];

            const script = document.createElement('script');
            script.src = "https://sf2prime.github.io/data/loader.js";
            document.body.appendChild(script);
        }

        function voltar() {
            location.reload();
        }

        // Inicializar
        initDB().then(() => {
            listarJogos();
        });
    </script>
</body>
</html>
