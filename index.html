<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Minha Biblioteca Arcade</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }
        .header {
            background: rgba(0,0,0,0.8);
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #00ff88;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 { color: #00ff88; font-size: 28px; }
        .header p { color: #888; margin-top: 5px; font-size: 14px; }
        .search-box { max-width: 600px; margin: 20px auto; padding: 0 20px; }
        .search-box input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #333;
            border-radius: 25px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        .search-box input:focus { border-color: #00ff88; }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .game-card {
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            border: 2px solid #333;
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }
        .game-card:hover {
            transform: translateY(-5px);
            border-color: #00ff88;
            box-shadow: 0 10px 30px rgba(0,255,136,0.3);
        }
        .game-card.cached { border-color: #00ff88; }
        .game-card.cached::after {
            content: '✓';
            position: absolute;
            top: 10px; right: 10px;
            background: #00ff88;
            color: #000;
            width: 24px; height: 24px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold;
        }
        .game-icon {
            width: 100%; height: 120px;
            background: rgba(0,0,0,0.5);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 48px;
            margin-bottom: 10px;
        }
        .game-title {
            font-size: 14px; font-weight: bold;
            text-align: center;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .game-size { font-size: 12px; color: #888; text-align: center; margin-top: 5px; }
        #game-container {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            z-index: 1000;
        }
        #game { width: 100%; height: 100%; }
        #back-btn {
            position: fixed;
            top: 10px; left: 10px;
            z-index: 1001;
            background: rgba(0,0,0,0.8);
            color: #fff;
            border: 2px solid #00ff88;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        #back-btn:hover { background: #00ff88; color: #000; }
        #loading {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            flex-direction: column;
            justify-content: center; align-items: center;
        }
        #loading h2 { color: #00ff88; margin-bottom: 20px; }
        .progress-bar {
            width: 80%; max-width: 400px;
            height: 30px;
            background: #1a1a2e;
            border: 2px solid #00ff88;
            border-radius: 5px;
            overflow: hidden;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff88, #00cc6a);
            width: 0%;
            transition: width 0.3s;
        }
        .progress-text {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-weight: bold; color: #000;
        }
        #status { margin-top: 15px; color: #888; }
        .stats { text-align: center; padding: 10px; color: #888; font-size: 14px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎮 Minha Biblioteca Arcade</h1>
        <p>Clique em um jogo para jogar • Cache automático</p>
    </div>

    <div class="search-box">
        <input type="text" id="search" placeholder="🔍 Buscar jogos..." oninput="filtrarJogos()">
    </div>

    <div class="stats" id="stats"></div>
    <div class="game-grid" id="gameGrid"></div>

    <div id="loading">
        <h2>🎮 Carregando...</h2>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
            <div class="progress-text" id="progressText">0%</div>
        </div>
        <div id="status">Preparando...</div>
    </div>

    <div id="game-container">
        <button id="back-btn" onclick="voltar()">← Voltar</button>
        <div id="game"></div>
    </div>

    <script>
        // URL DO RELEASE NO GITHUB - MUDE PARA SEU USUÁRIO
        const ROMS_URL = "https://github.com/Vdmtx/retroarchonline/releases/download/v1.0/";
        
        const jogos = [
            { nome: "Sonic Megamix", arquivo: "Sonic Megamix.zip", sistema: "fbneo" },
            { nome: "SVC Chaos", arquivo: "svc.zip", sistema: "fbneo" },
            { nome: "Samurai Shodown V", arquivo: "samsho5.zip", sistema: "fbneo" },
            { nome: "Samurai Shodown V Special", arquivo: "samsho5sp.zip", sistema: "fbneo" },
            { nome: "Matrimelee", arquivo: "matrim.zip", sistema: "fbneo" },
            { nome: "Garou: Mark of the Wolves", arquivo: "garou.zip", sistema: "fbneo" },
            { nome: "King of Fighters '99", arquivo: "kof99.zip", sistema: "fbneo" },
            { nome: "Street Fighter III 3rd Strike", arquivo: "sfiii3.zip", sistema: "fbneo" },
            { nome: "KOF 98AE 2016", arquivo: "kof98ae2016.zip", sistema: "fbneo" },
            { nome: "KOF 98AE", arquivo: "kof98ae.zip", sistema: "fbneo" },
            { nome: "Street Fighter III 2nd Impact", arquivo: "sfiii2.zip", sistema: "fbneo" },
            { nome: "KOF 98 Mix", arquivo: "kof98mix.zip", sistema: "fbneo" },
            { nome: "KOF 98 EC 2.0", arquivo: "kof98eck20.zip", sistema: "fbneo" },
            { nome: "Samurai Shodown FE", arquivo: "samsho5fe.zip", sistema: "fbneo" },
            { nome: "KOF 98-1", arquivo: "kof98-1.zip", sistema: "fbneo" },
            { nome: "KOF 98", arquivo: "kof98.zip", sistema: "fbneo" },
            { nome: "KOF 98K", arquivo: "kof98k.zip", sistema: "fbneo" },
            { nome: "KOF 98CB", arquivo: "kof98cb.zip", sistema: "fbneo" },
            { nome: "KOF 98 PFE", arquivo: "kof98pfe.zip", sistema: "fbneo" },
            { nome: "KOF 97", arquivo: "kof97.zip", sistema: "fbneo" },
            { nome: "KOF 96", arquivo: "kof96.zip", sistema: "fbneo" },
            { nome: "Street Fighter Alpha 3", arquivo: "sfa3.zip", sistema: "fbneo" },
            { nome: "Ultimate Mortal Kombat 3", arquivo: "umk3.zip", sistema: "fbneo" },
            { nome: "Ragnagard", arquivo: "ragnagrd.zip", sistema: "fbneo" },
            { nome: "Samurai Shodown 4", arquivo: "samsho4.zip", sistema: "fbneo" },
            { nome: "Hyper Street Fighter 2", arquivo: "hsf2.zip", sistema: "fbneo" },
            { nome: "Mortal Kombat 3", arquivo: "mk3k.zip", sistema: "fbneo" },
            { nome: "Art of Fighting 3", arquivo: "aof3.zip", sistema: "fbneo" },
            { nome: "Samurai Shodown 3", arquivo: "samsho3.zip", sistema: "fbneo" },
            { nome: "KOF 95", arquivo: "kof95.zip", sistema: "fbneo" },
            { nome: "Art of Fighting 2", arquivo: "aof2a.zip", sistema: "fbneo" },
            { nome: "Street Fighter Zero 2 Alpha", arquivo: "sfz2al.zip", sistema: "fbneo" },
            { nome: "Mortal Kombat 2", arquivo: "mk2.zip", sistema: "fbneo" },
            { nome: "Savage Reign", arquivo: "savagere.zip", sistema: "fbneo" },
            { nome: "KOF 94", arquivo: "kof94.zip", sistema: "fbneo" },
            { nome: "Fatal Fury Special", arquivo: "fatfursp.zip", sistema: "fbneo" },
            { nome: "Real Bout Fatal Fury", arquivo: "rbff1.zip", sistema: "fbneo" },
            { nome: "Real Bout Fatal Fury Special", arquivo: "rbffspec.zip", sistema: "fbneo" },
            { nome: "Last Blade 2", arquivo: "lastbld2.zip", sistema: "fbneo" },
            { nome: "Last Blade", arquivo: "lastblad.zip", sistema: "fbneo" },
            { nome: "Breakers Revenge", arquivo: "breakrev.zip", sistema: "fbneo" },
            { nome: "Street Fighter Alpha", arquivo: "sfa.zip", sistema: "fbneo" },
            { nome: "Mortal Kombat", arquivo: "mk.zip", sistema: "fbneo" }
        ];

        let db;
        const DB_NAME = 'ArcadeCache';
        const STORE_NAME = 'roms';

        async function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => { db = request.result; resolve(db); };
                request.onupgradeneeded = (e) => {
                    const database = e.target.result;
                    if (!database.objectStoreNames.contains(STORE_NAME)) {
                        database.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
            });
        }

        async function salvarCache(id, blob) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction([STORE_NAME], 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                const req = store.put({ id, blob, timestamp: Date.now() });
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }

        async function buscarCache(id) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction([STORE_NAME], 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const req = store.get(id);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function baixarComProgresso(arquivo, jogoId) {
            const loading = document.getElementById('loading');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            const status = document.getElementById('status');
            
            loading.style.display = 'flex';
            status.textContent = 'Verificando cache...';

            const cached = await buscarCache(jogoId);
            if (cached) {
                status.textContent = 'Carregando do cache...';
                progressFill.style.width = '100%';
                progressText.textContent = '100%';
                await new Promise(r => setTimeout(r, 500));
                loading.style.display = 'none';
                return URL.createObjectURL(cached.blob);
            }

            status.textContent = 'Baixando ROM...';
            const url = `${ROMS_URL}${encodeURIComponent(arquivo)}`;
            
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Arquivo não encontrado');
                
                const contentLength = response.headers.get('content-length');
                const total = parseInt(contentLength, 10);
                let loaded = 0;

                const reader = response.body.getReader();
                const stream = new ReadableStream({
                    start(controller) {
                        function push() {
                            reader.read().then(({ done, value }) => {
                                if (done) { controller.close(); return; }
                                loaded += value.length;
                                if (total) {
                                    const percent = Math.round((loaded / total) * 100);
                                    progressFill.style.width = percent + '%';
                                    progressText.textContent = percent + '%';
                                    status.textContent = `Baixando: ${(loaded/1024/1024).toFixed(1)}MB / ${(total/1024/1024).toFixed(1)}MB`;
                                }
                                controller.enqueue(value);
                                push();
                            });
                        }
                        push();
                    }
                });

                const blob = await new Response(stream).blob();
                await salvarCache(jogoId, blob);
                
                status.textContent = 'Pronto!';
                await new Promise(r => setTimeout(r, 500));
                loading.style.display = 'none';
                
                return URL.createObjectURL(blob);
            } catch (error) {
                alert('Erro: ' + error.message);
                loading.style.display = 'none';
                return null;
            }
        }

        async function renderizarJogos(lista = jogos) {
            const grid = document.getElementById('gameGrid');
            const stats = document.getElementById('stats');
            grid.innerHTML = '';
            
            let cachedCount = 0;
            
            for (const jogo of lista) {
                const cached = await buscarCache(jogo.nome);
                if (cached) cachedCount++;
                
                const card = document.createElement('div');
                card.className = 'game-card' + (cached ? ' cached' : '');
                card.innerHTML = `
                    <div class="game-icon">🕹️</div>
                    <div class="game-title">${jogo.nome}</div>
                    <div class="game-size">${jogo.sistema.toUpperCase()}</div>
                `;
                card.onclick = () => carregarJogo(jogo);
                grid.appendChild(card);
            }
            
            stats.textContent = `${lista.length} jogos • ${cachedCount} em cache`;
        }

        function filtrarJogos() {
            const busca = document.getElementById('search').value.toLowerCase();
            const filtrados = jogos.filter(j => j.nome.toLowerCase().includes(busca));
            renderizarJogos(filtrados);
        }

        async function carregarJogo(jogo) {
            const blobUrl = await baixarComProgresso(jogo.arquivo, jogo.nome);
            if (!blobUrl) return;

            document.getElementById('game-container').style.display = 'block';
            document.getElementById('back-btn').style.display = 'block';
            document.body.style.overflow = 'hidden';

            EJS_player = "#game";
            EJS_core = jogo.sistema;
            EJS_gameName = jogo.nome.replace(/\s+/g, '').toLowerCase();
            EJS_color = "#000000";
            EJS_startOnLoaded = true;
            EJS_fullscreenOnLoad = false;
            EJS_pathtodata = "https://sf2prime.github.io/data/";
            EJS_gameUrl = blobUrl;
            EJS_VirtualGamepadSettings = [
                {"type":"button","text":"A","id":"a","location":"right","right":145,"top":80,"bold":true,"input_value":0},
                {"type":"button","text":"B","id":"b","location":"right","right":75,"top":80,"bold":true,"input_value":8},
                {"type":"button","text":"C","id":"c","location":"right","right":5,"top":80,"bold":true,"input_value":11},
                {"type":"button","text":"X","id":"x","location":"right","right":145,"top":10,"bold":true,"input_value":1},
                {"type":"button","text":"Y","id":"y","location":"right","right":75,"top":10,"bold":true,"input_value":9},
                {"type":"button","text":"Z","id":"z","location":"right","right":5,"top":10,"bold":true,"input_value":10},
                {"type":"dpad","location":"left","left":"50%","right":"50%","joystickInput":false,"inputValues":[4,5,6,7]},
                {"type":"button","text":"Coin","id":"select","location":"center","left":-5,"fontSize":15,"block":true,"input_value":2},
                {"type":"button","text":"Start","id":"start","location":"center","left":60,"fontSize":15,"block":true,"input_value":3}
            ];

            const script = document.createElement('script');
            script.src = "https://sf2prime.github.io/data/loader.js";
            document.body.appendChild(script);
        }

        function voltar() {
            location.reload();
        }

        initDB().then(() => {
            renderizarJogos();
        });
    </script>
</body>
</html>
