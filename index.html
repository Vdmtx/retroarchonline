<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Minha Biblioteca Arcade</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }
        .header {
            background: rgba(0,0,0,0.8);
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #00ff88;
        }
        .header h1 { color: #00ff88; font-size: 28px; }
        .header p { color: #888; margin-top: 5px; font-size: 14px; }
        
        .info-box {
            background: rgba(0,255,136,0.1);
            border: 2px solid #00ff88;
            border-radius: 8px;
            padding: 15px;
            margin: 20px auto;
            max-width: 800px;
        }
        .info-box h3 { color: #00ff88; margin-bottom: 10px; }
        .info-box ul { 
            list-style: none; 
            padding-left: 0;
            color: #fff;
            font-size: 14px;
        }
        .info-box li { padding: 5px 0; }
        .info-box li::before { content: "✅ "; }
        
        .warning-box {
            background: rgba(255,136,0,0.1);
            border: 2px solid #ff8800;
            border-radius: 8px;
            padding: 15px;
            margin: 20px auto;
            max-width: 800px;
        }
        .warning-box h3 { color: #ff8800; margin-bottom: 10px; }
        .warning-box p { color: #ffcc88; font-size: 14px; }
        
        .search-box { max-width: 600px; margin: 20px auto; padding: 0 20px; }
        .search-box input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #333;
            border-radius: 25px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        .search-box input:focus { border-color: #00ff88; }
        
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .game-card {
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            border: 2px solid #333;
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .game-card:hover {
            transform: translateY(-5px);
            border-color: #00ff88;
            box-shadow: 0 10px 30px rgba(0,255,136,0.3);
        }
        .game-icon {
            width: 100%; height: 120px;
            background: rgba(0,0,0,0.5);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 48px;
