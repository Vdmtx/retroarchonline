<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Arcade Library</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%); 
            color: #fff; 
            font-family: Arial, sans-serif; 
            padding: 40px; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        h1 { 
            color: #00ff88; 
            text-align: center; 
            margin-bottom: 40px; 
            font-size: 42px; 
            text-shadow: 0 0 30px rgba(0,255,136,0.5); 
        }
        .menu-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 30px; 
            max-width: 1000px; 
            width: 100%;
        }
        .menu-card { 
            background: linear-gradient(145deg, #1a1a2e, #16213e); 
            border: 3px solid #333; 
            border-radius: 20px; 
            padding: 40px; 
            text-align: center; 
            cursor: pointer; 
            transition: all 0.3s;
            text-decoration: none;
            color: #fff;
            display: block;
        }
        .menu-card:hover { 
            transform: translateY(-10px) scale(1.05); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .menu-card.cps { border-color: #0088ff; }
        .menu-card.cps:hover { border-color: #00aaff; box-shadow: 0 20px 40px rgba(0,136,255,0.3); }
        .menu-card.midway { border-color: #ff0088; }
        .menu-card.midway:hover { border-color: #ff00aa; box-shadow: 0 20px 40px rgba(255,0,136,0.3); }
        .menu-card.neogeo { border-color: #ff8800; }
        .menu-card.neogeo:hover { border-color: #ffaa00; box-shadow: 0 20px 40px rgba(255,136,0,0.3); }
        .menu-icon { font-size: 80px; margin-bottom: 20px; }
        .menu-title { font-size: 28px; font-weight: bold; margin-bottom: 10px; }
        .menu-desc { color: #888; font-size: 14px; }
        .status { 
            display: inline-block; 
            padding: 5px 15px; 
            border-radius: 20px; 
            font-size: 12px; 
            margin-top: 15px; 
            font-weight: bold;
        }
        .status.ok { background: #00ff8833; color: #00ff88; }
        .status.warn { background: #ff880033; color: #ffaa00; }
    </style>
</head>
<body>
    <h1>🎮 ARCADE LIBRARY</h1>
    <div class="menu-grid">
        <a href="capcom.html" class="menu-card cps">
            <div class="menu-icon">👊</div>
            <div class="menu-title">CAPCOM</div>
            <div class="menu-desc">CPS-2 • CPS-3<br>Street Fighter • Marvel vs Capcom • X-Men</div>
            <span class="status ok">✅ FUNCIONANDO</span>
        </a>
        
        <a href="midway.html" class="menu-card midway">
            <div class="menu-icon">🥋</div>
            <div class="menu-title">MIDWAY</div>
            <div class="menu-desc">Mortal Kombat • NBA Jam • Cruis'n<br>Hydro Thunder • Rampage</div>
            <span class="status ok">✅ FUNCIONANDO</span>
        </a>
        
        <a href="neogeo.html" class="menu-card neogeo">
            <div class="menu-icon">🔥</div>
            <div class="menu-title">NEO GEO</div>
            <div class="menu-desc">King of Fighters • Metal Slug<br>Samurai Shodown • Fatal Fury</div>
            <span class="status warn">⚠️ BIOS INCOMPLETA</span>
        </a>
    </div>
</body>
</html>
