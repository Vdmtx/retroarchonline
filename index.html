<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Minha Biblioteca Arcade</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; color: #fff; font-family: Arial, sans-serif; padding: 20px; }
        h1 { color: #00ff88; text-align: center; margin-bottom: 30px; }
        .error-box { background: #ff000033; border: 2px solid #ff0000; padding: 20px; border-radius: 8px; margin: 20px auto; max-width: 600px; }
        .error-box h3 { color: #ff4444; margin-bottom: 10px; }
        .success-box { background: #00ff8833; border: 2px solid #00ff88; padding: 20px; border-radius: 8px; margin: 20px auto; max-width: 600px; }
        .success-box h3 { color: #00ff88; margin-bottom: 10px; }
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; max-width: 1200px; margin: 0 auto; }
        .game-card { background: #1a1a2e; border: 2px solid #333; border-radius: 8px; padding: 15px; cursor: pointer; text-align: center; transition: all 0.3s; }
        .game-card:hover { border-color: #00ff88; transform: translateY(-3px); }
        .game-icon { font-size: 48px; margin-bottom: 10px; }
        .game-title { font-weight: bold; margin-bottom: 5px; }
        .game-size { color: #888; font-size: 12px; }
        #game-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; }
        #game { width: 100%; height: 100%; }
        #back-btn { position: fixed; top: 10px; left: 10px; z-index: 1001; background: #000; color: #fff; border: 2px solid #00ff88; padding: 10px 20px; cursor: pointer; font-weight: bold; }
        #loading { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.95); padding: 30px; border: 2px solid #00ff88; border-radius: 8px; z-index: 2000; text-align: center; }
        #loading h2 { color: #00ff88; margin-bottom: 20px; }
        .progress-bar { width: 300px; height: 20px; background: #1a1a2e; border: 1px solid #00ff88; }
        .progress-fill { height: 100%; background: #00ff88; width: 0%; transition: width 0.3s; }
        #statusText { margin-top: 10px; color: #888; }
    </style>
</head>
<body>
    <h1>🎮 Minha Biblioteca Arcade</h1>
    <div id="status"></div>
    <div class="game-grid" id="gameGrid"></div>
    <div id="loading">
        <h2>🎮 Carregando...</h2>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <p id="statusText">Preparando...</p>
    </div>
    <div id="game-container">
        <button id="back-btn" onclick="voltar()">← Voltar</button>
        <div id="game"></div>
    </div>

    <script>
        const REPO = 'Vdmtx/retroarchonline';
        const RELEASE_TAG = '1.0';
        let jogos = [];

        async function carregarJogos() {
            const grid = document.getElementById('gameGrid');
            const status = document.getElementById('status');
            
            try {
                status.innerHTML = '<div style="text-align:center;color:#00ff88;grid-column:1/-1;">🔄 Carregando...</div>';
                const response = await fetch(`https://api.github.com/repos/${REPO}/releases/tags/${RELEASE_TAG}`);
                if (!response.ok) throw new Error('Release não encontrado');
                const release = await response.json();
                const assets = release.assets || [];
                if (assets.length === 0) throw new Error('Nenhum arquivo no release');
                
                jogos = assets.filter(asset => asset.name.toLowerCase().endsWith('.zip')).map(asset => ({
                    nome: asset.name.replace(/\.zip$/i, '').replace(/[_-]/g, ' '),
                    arquivo: asset.name,
                    url: asset.browser_download_url,
                    tamanho: asset.size
                }));
                
                status.innerHTML = `<div class="success-box"><h3>✅ ${jogos.length} jogo(s) disponível(is)!</h3><p>Clique para jogar online</p></div>`;
                grid.innerHTML = jogos.map(jogo => `
                    <div class="game-card" onclick="iniciarJogo('${jogo.arquivo}', '${jogo.nome}')">
                        <div class="game-icon">🕹️</div>
                        <div class="game-title">${jogo.nome}</div>
                        <div class="game-size">${(jogo.tamanho/1024/1024).toFixed(1)} MB</div>
                    </div>
                `).join('');
            } catch (error) {
                status.innerHTML = `<div class="error-box"><h3>❌ Erro</h3><p>${error.message}</p></div>`;
            }
        }

        async function iniciarJogo(arquivo, nome) {
            const loading = document.getElementById('loading');
            const progressFill = document.getElementById('progressFill');
            const statusText = document.getElementById('statusText');
            
            loading.style.display = 'block';
            statusText.textContent = 'Conectando...';
            progressFill.style.width = '10%';
            
            try {
                // Usa jsDelivr (CDN) para evitar CORS
                const jsdelivrUrl = `https://cdn.jsdelivr.net/gh/${REPO.replace('/', '/')}@${RELEASE_TAG}/${encodeURIComponent(arquivo)}`;
                
                // Tenta jsDelivr primeiro, senão usa GitHub direto com proxy
                let url = jsdelivrUrl;
                let useProxy = false;
                
                try {
                    const testResponse = await fetch(jsdelivrUrl, { method: 'HEAD' });
                    if (!testResponse.ok) {
                        useProxy = true;
                    }
                } catch (e) {
                    useProxy = true;
                }
                
                if (useProxy) {
                    // Fallback: GitHub Releases direto
                    url = `https://github.com/${REPO}/releases/download/${RELEASE_TAG}/${encodeURIComponent(arquivo)}`;
                }
                
                statusText.textContent = 'Baixando ROM...';
                progressFill.style.width = '30%';
                
                // Tenta fetch normal primeiro
                let response;
                try {
                    response = await fetch(url);
                } catch (fetchError) {
                    // Se falhar, tenta com proxy
                    statusText.textContent = 'Usando proxy...';
                    const proxyUrl = 'https://api.allorigins.win/raw?url=';
                    response = await fetch(proxyUrl + encodeURIComponent(url));
                }
                
                if (!response.ok) throw new Error(`Erro HTTP ${response.status}`);
                
                const contentLength = response.headers.get('content-length');
                const total = parseInt(contentLength, 10);
                let loaded = 0;

                const reader = response.body.getReader();
                const stream = new ReadableStream({
                    start(controller) {
                        function push() {
                            reader.read().then(({ done, value }) => {
                                if (done) { controller.close(); return; }
                                loaded += value.length;
                                if (total) {
                                    const percent = 30 + Math.round((loaded / total) * 70);
                                    progressFill.style.width = percent + '%';
                                    statusText.textContent = `Baixando: ${percent}%`;
                                }
                                controller.enqueue(value);
                                push();
                            });
                        }
                        push();
                    }
                });

                const blob = await new Response(stream).blob();
                const blobUrl = URL.createObjectURL(blob);
                
                statusText.textContent = 'Iniciando emulador...';
                progressFill.style.width = '100%';
                await new Promise(r => setTimeout(r, 500));
                
                document.getElementById('game-container').style.display = 'block';
                loading.style.display = 'none';
                
                window.EJS_player = "#game";
                window.EJS_core = "mame2003";
                window.EJS_gameName = nome.toLowerCase().replace(/[^a-z0-9]/g, '');
                window.EJS_color = "#000000";
                window.EJS_startOnLoaded = true;
                window.EJS_pathtodata = "https://sf2prime.github.io/data/";
                window.EJS_gameUrl = blobUrl;
                window.EJS_VirtualGamepadSettings = [
                    {"type":"button","text":"A","id":"a","location":"right","right":145,"top":80,"bold":true,"input_value":0},
                    {"type":"button","text":"B","id":"b","location":"right","right":75,"top":80,"bold":true,"input_value":8},
                    {"type":"button","text":"X","id":"x","location":"right","right":145,"top":10,"bold":true,"input_value":1},
                    {"type":"button","text":"Y","id":"y","location":"right","right":75,"top":10,"bold":true,"input_value":9},
                    {"type":"dpad","location":"left","left":"50%","right":"50%","joystickInput":false,"inputValues":[4,5,6,7]},
                    {"type":"button","text":"Coin","id":"select","location":"center","left":-5,"fontSize":15,"block":true,"input_value":2},
                    {"type":"button","text":"Start","id":"start","location":"center","left":60,"fontSize":15,"block":true,"input_value":3}
                ];
                
                const script = document.createElement('script');
                script.src = "https://sf2prime.github.io/data/loader.js";
                document.body.appendChild(script);
                
            } catch (error) {
                alert(`Erro ao carregar jogo:\n\n${error.message}\n\nTente outro jogo ou verifique sua conexão.`);
                loading.style.display = 'none';
            }
        }

        function voltar() { location.reload(); }
        carregarJogos();
    </script>
</body>
</html>
