<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Minha Biblioteca Arcade</title>
    <style>
        /* (Mantenha o CSS anterior, não alterou) */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; color: #fff; font-family: Arial, sans-serif; padding: 20px; }
        h1 { color: #00ff88; text-align: center; margin-bottom: 10px; font-size: 32px; }
        .subtitle { text-align: center; color: #888; margin-bottom: 30px; font-size: 14px; }
        .search-box { max-width: 600px; margin: 0 auto 30px; padding: 0 20px; }
        .search-box input { width: 100%; padding: 12px 20px; border: 2px solid #333; border-radius: 25px; background: rgba(255,255,255,0.1); color: #fff; font-size: 16px; outline: none; }
        .search-box input:focus { border-color: #00ff88; }
        .stats { text-align: center; color: #00ff88; margin-bottom: 20px; font-size: 14px; }
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; max-width: 1400px; margin: 0 auto; padding: 20px; }
        .game-card { background: #1a1a2e; border: 2px solid #333; border-radius: 12px; padding: 20px; cursor: pointer; text-align: center; }
        .game-card:hover { border-color: #00ff88; transform: translateY(-5px); }
        .game-icon { font-size: 56px; margin-bottom: 15px; }
        .game-title { font-weight: bold; margin-bottom: 8px; }
        .game-size { color: #888; font-size: 12px; }
        .system-badge { padding: 2px 6px; border-radius: 4px; font-size: 10px; margin-left: 5px; }
        .neogeo { background: #ff880033; color: #ff8800; }
        .cps { background: #0088ff33; color: #0088ff; }
        .mame { background: #00ff8833; color: #00ff88; }
        #game-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; }
        #game { width: 100%; height: 100%; }
        #back-btn { position: fixed; top: 15px; left: 15px; z-index: 1001; background: #000; color: #fff; border: 2px solid #00ff88; padding: 12px 24px; cursor: pointer; font-weight: bold; }
        #loading { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #000; padding: 40px; border: 2px solid #00ff88; z-index: 2000; text-align: center; min-width: 400px; }
        #loading h2 { color: #00ff88; margin-bottom: 20px; }
        .progress-bar { width: 100%; height: 25px; background: #333; margin: 15px 0; }
        .progress-fill { height: 100%; background: #00ff88; width: 0%; }
        #statusText { color: #888; }
    </style>
</head>
<body>
    <h1>🎮 Minha Biblioteca Arcade</h1>
    <p class="subtitle">Debug Mode • Use o Console (F12) para ver erros</p>
    <div class="search-box">
        <input type="text" id="search" placeholder="🔍 Buscar jogos..." oninput="filtrarJogos()">
    </div>
    <div class="stats" id="stats"></div>
    <div class="game-grid" id="gameGrid"></div>
    <div id="loading">
        <h2> Carregando...</h2>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <p id="statusText">Preparando...</p>
    </div>
    <div id="game-container">
        <button id="back-btn" onclick="voltar()">← Voltar</button>
        <div id="game"></div>
    </div>

    <script>
        const REPO = 'Vdmtx/retroarchonline';
        const ROMS_PATH = 'roms';
        const ROMS_BASE = 'https://vdmtx.github.io/retroarchonline/roms/';
        const BIOS_BASE = 'https://vdmtx.github.io/retroarchonline/bios/';
        const EJS_PATH = 'https://vdmtx.github.io/retroarchonline/data/';
        
        const NEOGEO_GAMES = ['kof', 'mslug', 'samsho', 'garou', 'rbff', 'fatfury', 'lastblad', 'metal', 'matrim', 'shocktr', 'blazstar', 'sengoku', 'aof'];
        const CPS_GAMES = ['sf2', 'captcomm', 'knights', 'dino', 'punisher', 'slammast', 'xmen', 'msh', 'mvc', 'jojo'];
        const MAME_GAMES = ['mk', 'mortal', 'nba', 'nfl', 'tekken'];
        
        let jogos = [];
        let jogosFiltrados = [];
        let neogeoBIOS = null;

        function detectarSistema(nomeArquivo) {
            const nome = nomeArquivo.toLowerCase();
            if (NEOGEO_GAMES.some(k => nome.includes(k))) return { sistema: 'neogeo', core: 'fbneo', badge: 'NEOGEO', class: 'neogeo', precisaBIOS: true };
            if (CPS_GAMES.some(k => nome.includes(k))) return { sistema: 'cps', core: 'fbneo', badge: 'CPS', class: 'cps', precisaBIOS: false };
            if (MAME_GAMES.some(k => nome.includes(k))) return { sistema: 'mame', core: 'mame2003', badge: 'MAME', class: 'mame', precisaBIOS: false };
            return { sistema: 'arcade', core: 'fbneo', badge: 'ARCADE', class: 'mame', precisaBIOS: false };
        }

        async function buscarNeoGeoBIOS() {
            try {
                const r = await fetch(ROMS_BASE + 'neogeo.zip', {method: 'HEAD'});
                if (r.ok) { neogeoBIOS = ROMS_BASE + 'neogeo.zip'; return true; }
                const r2 = await fetch(BIOS_BASE + 'neogeo.zip', {method: 'HEAD'});
                if (r2.ok) { neogeoBIOS = BIOS_BASE + 'neogeo.zip'; return true; }
            } catch(e) {}
            return false;
        }

        async function varrerPastaRoms() {
            try {
                const response = await fetch(`https://api.github.com/repos/${REPO}/contents/${ROMS_PATH}`);
                const files = await response.json();
                jogos = [];
                await buscarNeoGeoBIOS();
                files.forEach(file => {
                    if (file.name.endsWith('.zip') && !file.name.includes('neogeo.zip')) {
                        const nomeLimpo = file.name.replace(/\.zip$/i, '').replace(/[_-]/g, ' ');
                        jogos.push({ nome: nomeLimpo, arquivo: file.name, tamanho: file.size, ...detectarSistema(file.name) });
                    }
                });
                jogosFiltrados = [...jogos];
                renderizarJogos();
            } catch (e) { console.error(e); }
        }

        function renderizarJogos() {
            const grid = document.getElementById('gameGrid');
            const stats = document.getElementById('stats');
            stats.textContent = `${jogosFiltrados.length} jogos`;
            grid.innerHTML = jogosFiltrados.map(j => `
                <div class="game-card" onclick="iniciarJogo('${j.arquivo}', '${j.nome}', '${j.core}', ${j.precisaBIOS})">
                    <div class="game-icon">🕹️</div>
                    <div class="game-title">${j.nome} <span class="system-badge ${j.class}">${j.badge}</span></div>
                    <div class="game-size">${(j.tamanho/1024/1024).toFixed(1)} MB</div>
                </div>
            `).join('');
        }

        function filtrarJogos() {
            const busca = document.getElementById('search').value.toLowerCase();
            jogosFiltrados = busca ? jogos.filter(j => j.nome.toLowerCase().includes(busca)) : [...jogos];
            renderizarJogos();
        }

        function iniciarJogo(arquivo, nome, core, precisaBIOS) {
            const loading = document.getElementById('loading');
            loading.style.display = 'block';
            document.getElementById('game-container').style.display = 'block';

            // Configuração do EmulatorJS
            window.EJS_player = "#game";
            window.EJS_core = core;
            window.EJS_gameUrl = ROMS_BASE + encodeURIComponent(arquivo);
            window.EJS_pathtodata = EJS_PATH;
            
            // DEBUG ATIVADO - Veja erros no Console (F12)
            window.EJS_DEBUG_XX = true; 
            window.EJS_startOnLoaded = true;
            
            if (precisaBIOS && neogeoBIOS) window.EJS_biosUrl = neogeoBIOS;

            // Script do Loader
            const script = document.createElement('script');
            script.src = EJS_PATH + 'loader.js';
            document.body.appendChild(script);
        }

        function voltar() { location.reload(); }
        varrerPastaRoms();
    </script>
</body>
</html>
