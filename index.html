<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Minha Biblioteca Arcade</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; color: #fff; font-family: Arial, sans-serif; padding: 20px; }
        h1 { color: #00ff88; text-align: center; margin-bottom: 10px; font-size: 32px; }
        .subtitle { text-align: center; color: #888; margin-bottom: 30px; font-size: 14px; }
        .search-box { max-width: 600px; margin: 0 auto 30px; padding: 0 20px; }
        .search-box input { width: 100%; padding: 12px 20px; border: 2px solid #333; border-radius: 25px; background: rgba(255,255,255,0.1); color: #fff; font-size: 16px; outline: none; }
        .search-box input:focus { border-color: #00ff88; }
        .stats { text-align: center; color: #00ff88; margin-bottom: 20px; font-size: 14px; }
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; max-width: 1400px; margin: 0 auto; padding: 20px; }
        .game-card { background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%); border: 2px solid #333; border-radius: 12px; padding: 20px; cursor: pointer; text-align: center; transition: all 0.3s; }
        .game-card:hover { transform: translateY(-5px); border-color: #00ff88; box-shadow: 0 10px 30px rgba(0,255,136,0.3); }
        .game-icon { font-size: 56px; margin-bottom: 15px; }
        .game-title { font-weight: bold; font-size: 14px; margin-bottom: 8px; }
        .game-size { color: #888; font-size: 12px; }
        .system-badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px; margin-left: 5px; }
        .neogeo { background: #ff880033; color: #ffaa00; }
        .cps { background: #0088ff33; color: #00aaff; }
        .mame { background: #00ff8833; color: #00ff88; }
        #game-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; }
        #game { width: 100%; height: 100%; }
        #back-btn { position: fixed; top: 15px; left: 15px; z-index: 1001; background: rgba(0,0,0,0.9); color: #fff; border: 2px solid #00ff88; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #back-btn:hover { background: #00ff88; color: #000; }
        #loading { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.95); padding: 40px; border: 2px solid #00ff88; border-radius: 12px; z-index: 2000; text-align: center; min-width: 500px; max-height: 80vh; overflow-y: auto; }
        #loading h2 { color: #00ff88; margin-bottom: 20px; }
        .progress-bar { width: 100%; height: 25px; background: #1a1a2e; border: 2px solid #00ff88; border-radius: 12px; overflow: hidden; margin: 15px 0; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #00ff88, #00cc6a); width: 0%; transition: width 0.3s; }
        #statusText { margin-top: 10px; color: #888; font-size: 14px; }
        .debug-log { background: rgba(0,0,0,0.5); border: 1px solid #333; padding: 10px; border-radius: 6px; margin: 10px 0; font-size: 11px; color: #00ff88; text-align: left; max-height: 300px; overflow-y: auto; font-family: monospace; }
        .debug-log .error { color: #ff4444; }
        .debug-log .success { color: #00ff88; }
        .debug-log .info { color: #88ccff; }
    </style>
</head>
<body>
    <h1>🎮 Minha Biblioteca Arcade</h1>
    <p class="subtitle">EmulatorJS • Debug Completo</p>
    <div class="search-box">
        <input type="text" id="search" placeholder="🔍 Buscar jogos..." oninput="filtrarJogos()">
    </div>
    <div class="stats" id="stats"></div>
    <div class="game-grid" id="gameGrid">
        <div style="text-align:center;padding:40px;color:#00ff88;grid-column:1/-1;">🔄 Escaneando...</div>
    </div>
    <div id="loading">
        <h2> Carregando...</h2>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <p id="statusText">Preparando...</p>
        <div id="debugLog" class="debug-log"></div>
    </div>
    <div id="game-container">
        <button id="back-btn" onclick="voltar()">← Voltar</button>
        <div id="game"></div>
    </div>

    <script>
        const REPO = 'Vdmtx/retroarchonline';
        const ROMS_PATH = 'roms';
        const ROMS_BASE = 'https://vdmtx.github.io/retroarchonline/roms/';
        const BIOS_BASE = 'https://vdmtx.github.io/retroarchonline/bios/';
        const EJS_PATH = 'https://vdmtx.github.io/retroarchonline/data/';
        
        // Cores disponíveis no GitHub
        const CORES_DISPONIVEIS = {
            'fbneo': 'fbneo_libretro.wasm',
            'mame2003': 'mame2003_libretro.wasm',
            'mame2003_plus': 'mame2003_plus_libretro.wasm'
        };
        
        const NEOGEO_GAMES = ['kof', 'mslug', 'samsho', 'garou', 'rbff', 'fatfury', 'lastblad', 'metal', 'matrim', 'shocktr', 'blazstar', 'sengoku', 'aof', 'lbow', 'ninjacom', 'rotd', 'wjammers', 'karatour'];
        const CPS_GAMES = ['sf2', 'sfiii', 'captcomm', 'knights', 'dino', 'punisher', 'slammast', 'xmen', 'msh', 'mvc', 'vsav', 'mbomber', 'megaman', '1944', 'cybots', 'jojo', 'redearth', 'wof'];
        const MAME_GAMES = ['mk', 'mortal', 'nba', 'nfl', 'tekken', 'soul', 'virtua', 'doa'];
        
        let jogos = [];
        let jogosFiltrados = [];
        let neogeoBIOS = null;

        function log(msg, type = 'info') {
            console.log(msg);
            const debugLog = document.getElementById('debugLog');
            if (debugLog) {
                const div = document.createElement('div');
                div.className = type;
                div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
                debugLog.appendChild(div);
                debugLog.scrollTop = debugLog.scrollHeight;
            }
        }

        function detectarSistema(nomeArquivo) {
            const nome = nomeArquivo.toLowerCase();
            if (NEOGEO_GAMES.some(k => nome.includes(k))) {
                return { sistema: 'neogeo', core: 'fbneo', badge: 'NEOGEO', class: 'neogeo', precisaBIOS: true };
            }
            if (CPS_GAMES.some(k => nome.includes(k))) {
                return { sistema: 'cps', core: 'fbneo', badge: 'CPS', class: 'cps', precisaBIOS: false };
            }
            if (MAME_GAMES.some(k => nome.includes(k))) {
                return { sistema: 'mame', core: 'mame2003', badge: 'MAME', class: 'mame', precisaBIOS: false };
            }
            return { sistema: 'arcade', core: 'fbneo', badge: 'ARCADE', class: 'mame', precisaBIOS: false };
        }

        async function buscarNeoGeoBIOS() {
            log('🔍 Buscando NeoGeo BIOS...');
            try {
                const r1 = await fetch(ROMS_BASE + 'neogeo.zip', {method: 'HEAD'});
                if (r1.ok) { neogeoBIOS = ROMS_BASE + 'neogeo.zip'; log('✅ BIOS em /roms/neogeo.zip', 'success'); return true; }
            } catch(e) {}
            try {
                const r2 = await fetch(BIOS_BASE + 'neogeo.zip', {method: 'HEAD'});
                if (r2.ok) { neogeoBIOS = BIOS_BASE + 'neogeo.zip'; log('✅ BIOS em /bios/neogeo.zip', 'success'); return true; }
            } catch(e) {}
            log('⚠️ BIOS não encontrada', 'error');
            return false;
        }

        async function varrerPastaRoms() {
            try {
                log(' Acessando API do GitHub...');
                const apiUrl = `https://api.github.com/repos/${REPO}/contents/${ROMS_PATH}`;
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const files = await response.json();
                log(` ${files.length} arquivos encontrados`, 'success');
                
                jogos = [];
                await buscarNeoGeoBIOS();
                
                files.forEach(file => {
                    if (file.name.toLowerCase().endsWith('.zip') && file.name.toLowerCase() !== 'neogeo.zip') {
                        const nomeLimpo = file.name.replace(/\.zip$/i, '').replace(/[_-]/g, ' ');
                        const sistema = detectarSistema(file.name);
                        jogos.push({ nome: nomeLimpo, arquivo: file.name, tamanho: file.size, ...sistema });
                    }
                });
                
                jogos = jogos.sort((a, b) => a.nome.localeCompare(b.nome));
                if (jogos.length === 0) throw new Error('Nenhum ZIP encontrado');
                
                log(`✅ ${jogos.length} jogos carregados`, 'success');
                jogosFiltrados = [...jogos];
                renderizarJogos();
            } catch (err) {
                log(`❌ Erro: ${err.message}`, 'error');
                document.getElementById('gameGrid').innerHTML = `<div style="background:#f0000022;border:2px solid #f00;padding:30px;border-radius:8px;text-align:center;grid-column:1/-1;color:#f88;"><h3>❌ Erro</h3><p>${err.message}</p></div>`;
            }
        }

        function renderizarJogos() {
            const grid = document.getElementById('gameGrid');
            const stats = document.getElementById('stats');
            if (jogosFiltrados.length === 0) { 
                grid.innerHTML = '<div style="text-align:center;padding:40px;color:#888;grid-column:1/-1;">Nenhum jogo</div>'; 
                stats.textContent = ''; return; 
            }
            const neogeoCount = jogosFiltrados.filter(j => j.sistema === 'neogeo').length;
            const cpsCount = jogosFiltrados.filter(j => j.sistema === 'cps').length;
            const mameCount = jogosFiltrados.filter(j => j.sistema === 'mame').length;
            stats.textContent = `${jogosFiltrados.length} jogo(s) • ${neogeoCount} NeoGeo • ${cpsCount} CPS • ${mameCount} MAME`;
            grid.innerHTML = jogosFiltrados.map(jogo => `
                <div class="game-card" onclick="iniciarJogo('${jogo.arquivo}', '${jogo.nome}', '${jogo.core}', ${jogo.precisaBIOS})">
                    <div class="game-icon">🕹️</div>
                    <div class="game-title">${jogo.nome} <span class="system-badge ${jogo.class}">${jogo.badge}</span></div>
                    <div class="game-size">${(jogo.tamanho/1024/1024).toFixed(1)} MB</div>
                </div>
            `).join('');
        }

        function filtrarJogos() {
            const busca = document.getElementById('search').value.toLowerCase();
            jogosFiltrados = busca.length === 0 ? [...jogos] : jogos.filter(j => j.nome.toLowerCase().includes(busca));
            renderizarJogos();
        }

        async function verificarCore(core) {
            const coreFile = CORES_DISPONIVEIS[core];
            if (!coreFile) {
                log(`❌ Core ${core} não mapeado`, 'error');
                return false;
            }
            
            const coreUrl = EJS_PATH + 'cores/' + coreFile;
            log(`🔍 Verificando core: ${coreUrl}`);
            
            try {
                const response = await fetch(coreUrl, {method: 'HEAD'});
                if (response.ok) {
                    log(`✅ Core ${core} encontrado (${(response.headers.get('content-length')/1024/1024).toFixed(2)} MB)`, 'success');
                    return true;
                } else {
                    log(`❌ Core ${core} não encontrado (HTTP ${response.status})`, 'error');
                    return false;
                }
            } catch (e) {
                log(`❌ Erro ao verificar core ${core}: ${e.message}`, 'error');
                return false;
            }
        }

        async function iniciarJogo(arquivo, nome, core, precisaBIOS) {
            const loading = document.getElementById('loading');
            const progressFill = document.getElementById('progressFill');
            const statusText = document.getElementById('statusText');
            const debugLog = document.getElementById('debugLog');
            
            loading.style.display = 'block';
            debugLog.innerHTML = '';
            
            log(`🎮 Iniciando: ${nome}`, 'info');
            log(`📁 Arquivo: ${arquivo}`, 'info');
            log(`️ Core solicitado: ${core}`, 'info');
            
            progressFill.style.width = '10%';
            statusText.textContent = 'Verificando core...';
            
            // Verificar se o core existe
            const coreDisponivel = await verificarCore(core);
            if (!coreDisponivel) {
                log(`⚠️ Core ${core} não disponível, tentando alternativas...`, 'error');
                // Tentar cores alternativos
                for (const [altCore, altFile] of Object.entries(CORES_DISPONIVEIS)) {
                    if (altCore !== core) {
                        const altDisponivel = await verificarCore(altCore);
                        if (altDisponivel) {
                            core = altCore;
                            log(`✅ Usando core alternativo: ${core}`, 'success');
                            break;
                        }
                    }
                }
            }
            
            progressFill.style.width = '30%';
            statusText.textContent = 'Verificando ROM...';
            
            const romUrl = ROMS_BASE + encodeURIComponent(arquivo);
            log(`📡 ROM URL: ${romUrl}`, 'info');
            
            try {
                const romResponse = await fetch(romUrl, {method: 'HEAD'});
                if (romResponse.ok) {
                    log(`✅ ROM acessível (${(romResponse.headers.get('content-length')/1024/1024).toFixed(2)} MB)`, 'success');
                } else {
                    log(`❌ ROM inacessível (HTTP ${romResponse.status})`, 'error');
                }
            } catch (e) {
                log(`❌ Erro ROM: ${e.message}`, 'error');
            }
            
            // Verificar BIOS
            if (precisaBIOS && neogeoBIOS) {
                log(`💾 BIOS: ${neogeoBIOS}`, 'info');
            } else if (precisaBIOS && !neogeoBIOS) {
                log(`️ BIOS necessária mas não encontrada!`, 'error');
            }
            
            progressFill.style.width = '50%';
            statusText.textContent = 'Configurando EmulatorJS...';
            
            // Configurar EmulatorJS
            window.EJS_player = "#game";
            window.EJS_core = core;
            window.EJS_gameUrl = romUrl;
            window.EJS_gameName = nome.toLowerCase().replace(/[^a-z0-9]/g, '');
            window.EJS_color = "#000000";
            window.EJS_startOnLoaded = true;
            window.EJS_fullscreenOnLoaded = false;
            window.EJS_pathtodata = EJS_PATH;
            
            if (precisaBIOS && neogeoBIOS) {
                window.EJS_biosUrl = neogeoBIOS;
                log(`✅ BIOS configurada`, 'success');
            }
            
            window.EJS_VirtualGamepadSettings = [
                {"type":"button","text":"A","id":"a","location":"right","right":145,"top":80,"bold":true,"input_value":0},
                {"type":"button","text":"B","id":"b","location":"right","right":75,"top":80,"bold":true,"input_value":8},
                {"type":"button","text":"C","id":"c","location":"right","right":5,"top":80,"bold":true,"input_value":11},
                {"type":"button","text":"X","id":"x","location":"right","right":145,"top":10,"bold":true,"input_value":1},
                {"type":"button","text":"Y","id":"y","location":"right","right":75,"top":10,"bold":true,"input_value":9},
                {"type":"button","text":"Z","id":"z","location":"right","right":5,"top":10,"bold":true,"input_value":10},
                {"type":"dpad","location":"left","left":"50%","right":"50%","joystickInput":false,"inputValues":[4,5,6,7]},
                {"type":"button","text":"Coin","id":"select","location":"center","left":-5,"fontSize":15,"block":true,"input_value":2},
                {"type":"button","text":"Start","id":"start","location":"center","left":60,"fontSize":15,"block":true,"input_value":3}
            ];
            
            log(`📦 EJS Path: ${EJS_PATH}`, 'info');
            log(`🎮 Core: ${core}`, 'info');
            log(`🎮 ROM: ${romUrl}`, 'info');
            
            document.getElementById('game-container').style.display = 'block';
            progressFill.style.width = '70%';
            statusText.textContent = 'Carregando EmulatorJS...';
            
            // Carregar loader.js
            const script = document.createElement('script');
            script.src = EJS_PATH + 'loader.js';
            
            script.onload = function() {
                log('✅ loader.js carregado', 'success');
                progressFill.style.width = '90%';
                statusText.textContent = 'Inicializando emulador...';
                
                // Aguardar inicialização
                setTimeout(() => {
                    const canvas = document.querySelector('#game canvas');
                    if (canvas) {
                        log('✅ Emulador inicializado!', 'success');
                        progressFill.style.width = '100%';
                        statusText.textContent = 'Jogo iniciado!';
                        setTimeout(() => { loading.style.display = 'none'; }, 1000);
                    } else {
                        log('⚠️ Canvas não encontrado, aguardando...', 'info');
                        setTimeout(() => {
                            const canvas2 = document.querySelector('#game canvas');
                            if (canvas2) {
                                log('✅ Emulador inicializado (delayed)!', 'success');
                                progressFill.style.width = '100%';
                                statusText.textContent = 'Jogo iniciado!';
                                setTimeout(() => { loading.style.display = 'none'; }, 1000);
                            } else {
                                log('❌ Emulador não inicializou', 'error');
                                statusText.textContent = 'Erro!';
                            }
                        }, 5000);
                    }
                }, 3000);
            };
            
            script.onerror = function() {
                log(`❌ Erro ao carregar loader.js de ${EJS_PATH}loader.js`, 'error');
                statusText.textContent = 'Erro!';
            };
            
            log('📥 Carregando loader.js...', 'info');
            document.body.appendChild(script);
        }

        function voltar() { location.reload(); }
        
        log('🚀 Aplicação iniciada', 'success');
        varrerPastaRoms();
    </script>
</body>
</html>
